rules:
  R1:
    name: {en: Units, ko: 단위}
    en: "All positions are in US dollar billions. Where the publisher converts (BIS, IMF, TIC), its dollar figure is used. National series are converted at BIS rates: a stock at the period-end rate, a period average at the period's average rate. The rate is named in the provenance. An economy whose currency is another's (Ecuador, El Salvador, Timor-Leste and Panama in dollars; Kosovo, Andorra, Montenegro and San Marino in euros; Guinea-Bissau in CFA francs; West Bank and Gaza in shekels) is converted at that currency's rate, and so is a dated regime (Zimbabwe in dollars from February 2009 to June 2019). A source series whose early segment is in a unit the source later superseded (Sierra Leone's broad money before 2015 in old leones) is corrected by a listed factor before anything else. A value with no rate is left out, never filled in, and the Method page says which economies and months; the IMF's currency-union aggregates (ECCU, WAEMU) are never drawn and are listed apart."
    ko: "모든 잔액은 미국 달러 10억 단위(billion)로 계산합니다(1 billion은 10억입니다). 한국어 화면에는 억 달러 단위로 표시합니다. 발표기관이 환산한 경우(BIS, IMF, TIC)는 그 달러 값을 씁니다. 각국 자료는 BIS 환율로 환산합니다. 잔액은 기말 환율, 기간 평균은 평균 환율을 씁니다. 쓴 환율은 출처 정보에 밝힙니다. 다른 나라 통화를 쓰는 경제(달러를 쓰는 에콰도르, 엘살바도르, 동티모르, 파나마, 유로를 쓰는 코소보, 안도라, 몬테네그로, 산마리노, CFA 프랑을 쓰는 기니비사우, 셰켈을 쓰는 요르단강 서안·가자)는 그 통화의 환율로 환산합니다. 기간이 정해진 체제(2009년 2월부터 2019년 6월까지 달러를 쓴 짐바브웨)도 같습니다. 출처가 나중에 바꾼 단위로 앞부분이 적힌 시계열(2015년 이전 옛 레온 단위의 시에라리온 광의통화)은 정해 둔 배율로 먼저 고칩니다. 환율이 없는 값은 채워 넣지 않고 제외합니다. 방법론 페이지에 어느 경제의 어느 달인지 밝힙니다. IMF의 통화동맹 집계(동카리브 통화동맹, 서아프리카 경제통화동맹)는 그리지 않고 따로 적습니다."
    why: {en: "Sums across sources need one unit; a stock converted at an average rate is misstated. The verification of 31 Oct 2026 found 6,331 values without a rate, of which 539 Zimbabwean months fell in its dollar years and 1,206 West Bank and Gaza months had a shekel rate under another code.", ko: "출처를 가로지르는 합계에는 단위가 하나여야 합니다. 잔액을 평균 환율로 환산하면 값이 왜곡됩니다. 2026년 10월 31일 검증에서 환율 없는 값 6,331개 가운데 짐바브웨의 539개월은 달러 사용기에 속했습니다. 요르단강 서안·가자의 1,206개월은 다른 코드 아래 셰켈 환율이 있었습니다."}
    fn: rules.r1_units
    tests: [test_r1_stock_at_period_end_average_at_average, test_r1_dollarised_economy_converts_at_one, test_r1_dated_currency_regime]
  R2:
    name: {en: Totals only, ko: 총계만}
    en: "A ribbon reads only total rows: all sectors, all currencies, one instrument per channel. Breakdowns appear on hover and in the table, never in a sum."
    ko: "리본은 총계 행만 읽습니다. 전 부문, 전 통화 기준이며 경로마다 한 상품입니다. 세부 항목은 툴팁과 표에만 나오고 합계에는 들어가지 않습니다."
    why: {en: "The links table keeps breakdown rows next to totals.", ko: "links 표에는 총계 옆에 세부 행이 함께 있습니다."}
    fn: rules.r2_totals_only
    tests: [test_r2_takes_total_not_breakdowns]
  R3:
    name: {en: One frequency per period, ko: 기간마다 한 주기}
    en: "Where a source has a half-yearly and an annual figure for the same December, the half-yearly one is used; if they differ, the pair is flagged."
    ko: "같은 12월에 반기 값과 연간 값이 함께 있으면 반기 값을 씁니다. 두 값이 다르면 표시합니다."
    why: {en: "CPIS (PIP) carries S and A rows at each December.", ko: "CPIS(PIP)는 12월마다 반기(S)와 연간(A) 행을 함께 싣습니다."}
    fn: rules.r3_one_frequency
    tests: [test_r3_prefers_half_yearly]
  R4:
    name: {en: One report per pair, ko: 짝마다 한 보고}
    en: "For direct investment, one reporter per pair for the whole series: the reporter with the most years, and on a tie the host's (debtor's) own report, then the investor's (creditor's), then a mirror. Who reported it is shown, and the other report's figure, where one exists, is in the tooltip. A negative position (reverse investment, netted intercompany debt) is kept as reported and enters its ladder as a negative part; a confidential cell has no value in the IMF file and is indistinguishable from a year not reported."
    ko: "직접투자는 짝마다 보고 주체 하나를 전 기간에 걸쳐 씁니다. 보고 연도가 가장 많은 쪽을 고릅니다. 연도가 같으면 투자 대상국의 자체 보고, 투자국의 보고, 상대국 자료로 만든 미러 순으로 고릅니다. 보고 주체를 표시하고, 다른 쪽 보고가 있으면 그 값을 툴팁에 표시합니다. 음의 잔액(역투자, 상계된 계열사 간 채무)은 보고된 대로 두고 사다리에 음의 부분으로 넣습니다. 비공개 셀은 IMF 파일에 값이 없어 보고하지 않은 해와 구별되지 않습니다."
    why: {en: "DIP has up to three reports per pair; adding them counts the same position up to three times. Mirrors are copies of the counterpart's report (0 differences in 329,399 pairs, 29 Oct 2026). Choosing per year made 2,027 pairs step from one reporter to another, by up to 50% and more. The longest series is chosen over the host's because a series that never changes reporter is worth more than a host's valuation in some years: 3,869 of 11,051 doubly reported pairs are drawn from the investor for that reason (31 Oct 2026).", ko: "DIP에는 짝마다 보고가 최대 세 개 있습니다. 모두 더하면 같은 잔액이 최대 세 번 중복 계상됩니다. 미러는 상대국 보고의 복사본입니다(2026년 10월 29일 기준 329,399개 짝에서 차이 0). 해마다 보고 주체를 고르면 2,027개 짝이 보고 주체 사이를 오가며 50% 넘게 변동했습니다. 투자 대상국 보고보다 가장 긴 시계열을 고르는 이유는 보고 주체가 바뀌지 않는 시계열이 몇 해의 투자 대상국 평가보다 가치가 높기 때문입니다. 이 때문에 양쪽이 보고한 11,051개 짝 가운데 3,869개는 투자국 보고를 씁니다(2026년 10월 31일)."}
    fn: rules.r4_one_report_per_pair
    tests: [test_r4_takes_host_report, test_r4_one_reporter_per_series, test_r4_negative_position_handling]
  R5:
    name: {en: One instrument, one channel, ko: 한 상품은 한 경로로}
    en: "The bank channel takes BIS LBS loans and deposits only. The other instruments are split and never enter the bank ribbon: debt securities that banks hold stay in portfolio debt (shown as context); derivatives and other instruments, which no other channel holds, are a pool of their own, shown as context with its own total only: the LBS other instruments are wider than derivatives, so the IIP derivatives item is not their border total (method 1.6). Reporters that publish no instrument split by counterparty (Japan, Germany) are named in the not-identified node, never estimated; the lender cut (R21) lists them apart with their all-instrument amount, and the coverage panel shows their share of the all-reporter total (26% of claims on Thailand, 28% on the UK, 31 Oct 2026). The BIS all-reporter aggregate that the Signal Board reads (R17) already allocates them by instrument, so A1 and B1 carry them."
    ko: "은행 경로에는 BIS LBS의 대출·예금만 포함됩니다. 다른 상품은 따로 나누며 은행 리본에 포함하지 않습니다. 은행이 보유한 채무증권은 증권투자 채무증권에 남겨 참고로 표시합니다. 파생상품과 기타 상품은 다른 경로에 포함되지 않으므로 별도 풀로 두고, 자체 합계만 참고로 표시합니다. LBS 기타 상품은 파생상품보다 범위가 넓어 IIP 파생상품 항목을 그 국경 간 합계로 볼 수 없습니다(방법론 1.6). 거래상대방별 상품 구분을 공개하지 않는 보고국(일본, 독일)은 추정하지 않고 '미식별' 노드에 이름만 표시합니다. 대출기관 회수(R21)에서는 이들을 모든 상품 금액과 함께 따로 표시합니다. 포괄 범위 패널은 전체 보고국 합계에서 이들이 차지하는 비중을 표시합니다(2026년 10월 31일 기준 태국 앞 채권의 26%, 영국 앞 채권의 28%). 신호판(R17)이 읽는 BIS 전체 보고국 합계는 이들을 이미 상품별로 배분하므로 A1과 B1에는 이들이 포함됩니다."
    why: {en: "BIS bank claims cover all instruments, and CPIS counts the bonds again. Worldwide, 7.8 tn of banks' derivatives and other instruments were in no channel (29 Oct 2026).", ko: "BIS 은행 청구권은 모든 상품을 포함하고, CPIS가 채권을 다시 계상합니다. 세계 전체로 은행의 파생상품·기타 7.8조 달러가 어느 경로에도 포함되지 않았습니다(2026년 10월 29일)."}
    fn: rules.r5_bank_loans_and_deposits
    tests: [test_r5_bank_channel_is_loans_and_deposits, test_r5_three_way_split, test_r5_no_split_reporters_disclosed]
  R6:
    name: {en: Gap to the whole, ko: 전체와의 차이}
    en: "Each ladder adds up to its total for the channel. What the pair data do not identify is a 'not identified' node, and the identified share is shown as coverage. The IMF's confidential group of reserve managers and international organisations (SEFER and SSIO) is an identified holder, drawn as one node and never ranked. The FDI total is the DIP's own all-investor figure where the DIP has the year, so that parts and total are on one valuation basis; the IIP item is the border. When pair data exceed the total, the excess is shown and flagged, never clipped, and coverage is capped at 100%."
    ko: "사다리는 경로별 총계와 합치합니다. 짝 자료로 확인되지 않는 부분은 '미확인' 노드가 됩니다. 확인된 비율을 포괄률로 표시합니다. IMF가 비공개 집단으로 공표하는 준비자산 운용기관·국제기구(SEFER, SSIO) 보유분은 확인된 보유자로서 노드 하나로 그립니다. 순위에는 넣지 않습니다. 직접투자 총계는 DIP에 해당 연도 자료가 있으면 DIP 자체의 전체 투자국 합계를 사용하여 부분과 총계의 평가 기준을 맞춥니다. IIP 항목은 국경에 둡니다. 짝 자료가 총계를 넘으면 초과분을 그대로 표시하고 초과로 표시합니다. 포괄률은 100%를 넘지 않습니다."
    why: {en: "Some holders do not report, and some BIS reporters give only an all-countries figure. Reserve managers held 5.0 tn of the 22.5 tn 'not identified' worldwide; the DIP is at book value for the largest hosts (USA 5,708 against 13,060 in the IIP), so the IIP made a valuation gap look like missing investors (29 Oct 2026).", ko: "보고하지 않는 보유국이 있고, 일부 BIS 보고국은 전체 국가 합계만 공표합니다. 세계 '미확인' 22.5조 달러 가운데 5.0조 달러는 준비자산 운용기관 보유분이었습니다. DIP는 큰 투자 대상국에서 장부가치 기준입니다(미국 5,708 대 IIP 13,060). 그래서 IIP와 비교하면 평가 차이가 누락된 투자국처럼 보였습니다(2026년 10월 29일)."}
    fn: rules.r6_gap_to_total
    tests: [test_r6_gap_and_excess, test_r6_reserves_group_and_cap]
  R7:
    name: {en: Periods, ko: 기간}
    en: "Figures are added only within one period. In the aligned setting (the default), portfolio and bank sit at the newest period both share; direct investment, which is annual, sits at its own newest year at or before that period, labelled with the year, and is never summed with the other channels. In the newest setting each channel sits at its own period and no cross-period total is drawn. The IIP is part of the alignment: the border total is the IIP item of the aligned period itself, and an economy whose IIP is annual is aligned at a year-end; in the newest setting the IIP item of the newest portfolio period is shown, or none."
    ko: "수치는 같은 기간 안에서만 더합니다. 정렬 설정(기본값)에서는 증권과 은행을 둘이 공유하는 가장 최근 기간에 맞춥니다. 연간 자료인 직접투자는 그 기간 이전의 자기 최신 연도에 두고 연도를 표시하며, 다른 경로와 더하지 않습니다. 최신 설정에서는 경로마다 자기 최신 기간을 쓰고 기간을 넘는 합계는 그리지 않습니다. IIP도 정렬에 들어갑니다. 국경 총계는 정렬 기간 자체의 IIP 항목이며, IIP가 연간인 경제는 연말에 맞춥니다. 최신 설정에서는 최신 증권투자 기간의 IIP 항목을 표시하고, 없으면 비워 둡니다."
    why: {en: "Banks are quarterly, CPIS half-yearly, DIP annual. Waiting for a DIP year equal to the aligned quarter left the FDI ribbon unsplit in 289 of 324 ladders (29 Oct 2026).", ko: "은행은 분기, CPIS는 반기, DIP는 연간 자료입니다. DIP 연도가 정렬 분기와 같아지기를 기다리느라 324개 사다리 가운데 289개에서 직접투자 리본이 나뉘지 않았습니다(2026년 10월 29일)."}
    fn: rules.r7_periods
    tests: [test_r7_aligned_shares_one_period, test_r7_fdi_own_period, test_r7_iip_border_period]
  R8:
    name: {en: Flows, ko: 흐름}
    en: "Published flows (BIS adjusted changes, TIC net purchases, BOP transactions, fund flows) are used as published. Flows derived from two positions are labelled 'includes valuation changes and breaks'. The two kinds are never added together."
    ko: "발표된 흐름(BIS 조정 변동, TIC 순매입, BOP 거래, 펀드 흐름)은 발표된 그대로 씁니다. 두 시점 잔액의 차이로 구한 흐름에는 '평가 변동과 단절 포함'을 붙입니다. 두 종류는 서로 더하지 않습니다."
    why: {en: "Position changes mix price and exchange-rate moves with transactions.", ko: "잔액 변화에는 거래와 함께 가격·환율 변동이 섞입니다."}
    papers: ["46142"]
    fn: rules.r8_flow_kinds
    tests: [test_r8_never_adds_published_and_derived]
  R9:
    name: {en: Layers, ko: 층위}
    en: "Core money (layer 0: the central bank's balance sheet, currency, bank reserves) and bank money (layer 1: deposits, as each source defines broad money) are a hierarchy of what counts as money for whom, never addends: bank reserves are inside bank money's backing, so the layers are drawn side by side and no screen sums them. Layer 2 (L, money funds, stablecoins) is context and is never added to them. Cross-border positions are never added to money created: a cross-border bank loan creates a deposit at the lending bank (offshore money creation); bond-market and non-bank lending move existing money. Bank money is the publisher's broad money (IMF), M2 (United States, Korea) or M2 and M3 (euro area), named on each tile."
    ko: "본원통화(0층: 중앙은행 대차대조표, 현금, 지급준비금)와 은행 통화(1층: 예금, 출처마다 정한 광의통화)는 누구에게 무엇이 돈인지의 층위이며 더하는 항목이 아닙니다. 지급준비금은 은행 통화의 뒷받침 안에 있으므로 층을 나란히 그리고 어떤 화면도 합치지 않습니다. 2층(L, MMF, 스테이블코인)은 참고 정보이며 이들과 더하지 않습니다. 국경 간 잔액은 창출된 돈에 더하지 않습니다. 국경 간 은행 대출은 대출 은행에 예금을 만들고(역외 통화 창출), 채권시장과 비은행 대출은 있는 돈을 옮깁니다. 은행 통화는 발표기관의 광의통화(IMF), M2(미국, 한국), M2와 M3(유로지역)이며 타일마다 이름을 적습니다."
    why: {en: "Banks' lending creates money; bond-market and non-bank lending moves it. Monetary base and deposits overlap (US bank reserves alone are about USD 3 tn), so their sum would be a double count.", ko: "은행 대출은 돈을 만들고, 채권시장과 비은행 대출은 돈을 옮깁니다. 본원통화와 예금은 겹치므로(미국 지급준비금만 약 3조 달러) 더하면 이중 계산이 됩니다."}
    papers: ["68434", "62137", "45755"]
    fn: rules.r9_layers
    tests: [test_r9_layers_not_added, test_r9_layers_not_summed_anywhere]
  R10:
    name: {en: Basis, ko: 기준}
    en: "Residence by default. Nationality changes only the bank channel (BIS CBS); every other channel stays on residence and is labelled so."
    ko: "기본값은 거주성 기준입니다. 국적 기준은 은행 경로(BIS CBS)에만 적용합니다. 다른 경로는 거주성 기준임을 밝힙니다."
    why: {en: "Financial centres hold about a quarter of external positions; the nationality view reassigns positions to the parent's country.", ko: "금융중심지가 대외 잔액의 약 4분의 1을 차지합니다. 국적 기준은 잔액을 모회사 국가로 옮겨 계상합니다."}
    papers: ["44611", "44537"]
    fn: rules.r10_basis
    tests: [test_r10_nationality_only_bank]
  R11:
    name: {en: Aggregates, ko: 집계 단위}
    en: "A source aggregate (BIS 'all reporters', the euro area, TIC's grand total) is used as a total, never added to its members."
    ko: "출처의 집계 단위(BIS 전체 보고국, 유로지역, TIC 총계)는 총계로만 쓰고 그 구성국과 더하지 않습니다."
    why: {en: "Aggregates and their members sit side by side in the tables.", ko: "표에는 집계와 구성국을 나란히 표시합니다."}
    fn: rules.r11_aggregates
    tests: [test_r11_aggregate_not_a_holder]
  R12:
    name: {en: Duplicates, ko: 중복}
    en: "Rows with the same key and the same value are kept once. Rows with the same key and different values stop the build."
    ko: "키와 값이 같은 행은 하나만 남깁니다. 키가 같고 값이 다른 행이 있으면 빌드를 멈춥니다."
    why: {en: "Some source files repeat a series (IMF IRFCL).", ko: "일부 원자료 파일은 같은 시계열을 두 번 싣습니다(IMF IRFCL)."}
    fn: rules.r12_duplicates
    tests: [test_r12_exact_repeat_dropped_conflict_stops]
  R13:
    name: {en: Precision, ko: 정밀도}
    en: "Computed at full precision and rounded only for display (0.1 bn, 0.1%). Totals are computed before rounding, so a table's rows can differ from its total by rounding; the table says so. The browser never adds."
    ko: "전체 정밀도로 계산하고 표시할 때만 반올림합니다. 금액은 억 달러 단위 정수(영문은 0.1 bn), 비율은 0.1%입니다. 합계는 반올림 전에 구하므로 표의 행 합과 합계가 반올림 오차만큼 다를 수 있으며, 표에 이를 밝힙니다. 브라우저는 더하지 않습니다."
    why: {en: "Sums must not depend on display rounding.", ko: "합계는 표시 반올림에 좌우되지 않아야 합니다."}
    fn: rules.r13_precision
    tests: [test_r13_totals_before_rounding]
  R14:
    name: {en: No commercial data, ko: 상업 자료 미사용}
    en: "Every figure on the site comes from an official or open source. Commercial data (fund-flow and market-data vendors) are not published in any form, not even as aggregates; the check scans every public file for a vendor's name or a fund-level field. Vendor aggregates were shown from 29 Oct to 1 Nov 2026 and were then removed."
    ko: "사이트의 모든 수치는 공식 통계나 공개 자료에서 나옵니다. 상업 자료(펀드 자금흐름·시장 데이터 공급사)는 집계치로도 싣지 않습니다. 검증은 공개 파일마다 공급사 이름과 펀드 단위 필드를 찾습니다. 공급사 집계치는 2026년 10월 29일부터 11월 1일까지 표시했다가 내렸습니다."
    why: {en: "The user's decision of 1 Nov 2026: no commercial data on datasteg sites; the files stay on the dev machines.", ko: "2026년 11월 1일 결정. datasteg 사이트에는 상업 자료를 쓰지 않고, 파일은 작업 컴퓨터에만 둡니다."}
    fn: rules.r14_no_commercial_data
    tests: [test_r14_no_commercial_data]
  R15:
    name: {en: Revisions, ko: 수정}
    en: "A release uses the newest vintage of each dataset at build time. A mark changes only when its source's vintage changes."
    ko: "릴리스는 빌드 시점에 각 자료의 최신 판을 씁니다. 표시값은 출처의 판이 바뀔 때만 바뀝니다."
    why: {en: "Publishers revise past periods; IIP for 2025–26 is preliminary.", ko: "발표기관은 과거 기간을 수정합니다. 2025~26년 IIP는 잠정치입니다."}
    fn: rules.r15_revisions
    tests: [test_r15_change_needs_new_vintage]
  R16:
    name: {en: Quarantine, ko: 격리}
    en: "A monthly, quarterly or annual stock observation is judged when the series moves more than tenfold against the previous value in the source's own currency. A move that returns to the old level within two periods (a spike) is dropped and the gap flagged. A ratio that is a power of ten (a unit error in the source) rescales every value at the new level by that power of ten back to the earlier level, so the series goes on instead of stopping; the earlier segment is the one trusted, and a wrong earlier segment is corrected by a listed unit correction (R1) before this rule runs. A new level that is impossible or implausible, non-resident claims or liabilities above the economy's IIP total on that side (they are a part of it), is dropped with every later value at that level, so the series stops rather than jumps. Real moves stay; check V13 lists every segment with its raw values and marks any that starts within a month of a listed currency redenomination (config/redenominations.csv), the case a source that stopped back-converting would produce."
    ko: "월·분기·연간 잔액 관측치는 원자료 통화 기준으로 직전 값보다 10배 넘게 움직이면 심사합니다. 두 기간 안에 옛 수준으로 돌아오는 변동(급등락)은 제외하고 빈자리를 표시합니다. 비율이 10의 거듭제곱이면(원자료의 단위 오류) 새 수준의 값을 모두 그 거듭제곱으로 되돌려 앞 수준에 맞춥니다. 이렇게 하면 시계열이 멈추지 않고 이어집니다. 앞부분을 믿되, 앞부분이 틀린 경우는 이 규칙보다 먼저 적용하는 단위 보정(R1)으로 고칩니다. 새 수준이 불가능하거나 비현실적이면(비거주자 채권·채무가 그 일부인 그쪽 IIP 총계를 초과하는 경우) 그 값과 같은 수준의 뒤 값을 모두 제외합니다. 이렇게 하면 시계열이 튀지 않고 멈춥니다. 실제 변동은 남깁니다. 점검 V13은 모든 구간을 원값과 함께 표시합니다. 정해 둔 화폐 단위 변경일(config/redenominations.csv)의 한 달 안에 시작하는 구간은 따로 표시합니다. 출처가 환산을 멈추면 이런 모양이 됩니다."
    why: {en: "Release 20261029.2 carried Portugal's banks' claims on non-residents at a million times their level, Switzerland's central bank liabilities at 218 times, Uruguay's monetary base at a thousand times: errors in the IMF files that a warn-only check let through (docs/DATA-AUDIT.md F7). Dropping a unit error ended Uruguay's monetary base in 2018-09 for good (94 months) and kept the wrong segment of Sierra Leone's broad money; the verification of 31 Oct 2026 found no redenomination among the segments, the IMF files being back-converted.", ko: "릴리스 20261029.2에는 포르투갈 은행의 대외채권(비거주자 청구권)이 100만 배, 스위스 중앙은행의 채무가 218배, 우루과이 본원통화가 1,000배로 실려 있었습니다. IMF 파일의 오류를 경고만 하는 점검이 그대로 통과시켰습니다(docs/DATA-AUDIT.md F7). 단위 오류를 빼기만 하니 우루과이 본원통화가 2018년 9월에서 영영 멈췄고(94개월) 시에라리온 광의통화는 틀린 쪽이 남았습니다. 2026년 10월 31일 검증에서 구간 가운데 화폐 단위 변경은 없었습니다. IMF 파일은 환산돼 있습니다."}
    fn: rules.r16_quarantine
    tests: [test_r16_quarantine_spike_unit_and_bound, test_r16_keeps_real_moves, test_r16_unit_error_rescaled_not_dropped, test_r16_redenomination_guard]

  R17:
    name: {en: Signal Board indicators, ko: 신호판 지표}
    en: "Each borrowing economy is read from its own side. Scored exposures: A1 = foreign-currency credit to non-banks / GDP, by residence of the borrower: cross-border loans and deposits to resident non-banks in US dollars, euros and yen (BIS LBS), plus the foreign-currency claims of banks inside the economy on resident non-banks where the economy reports them to the LBS (local positions, all foreign currencies, all instruments: the only published cell with a sector split; 26 of the 36 board economies report it, the rest are marked), plus international debt securities of resident non-bank issuers in those currencies (BIS DSS by residence), the economy's own currency left out, over the four-quarter GDP implied by BIS total credit (the newest quarter carries the one before). A2 = BIS banks' claims due within a year ÷ reserve base. The numerator is BIS CBS international claims with remaining maturity up to one year (immediate counterparty; bank type 4O, all reporting banks excluding inside-area foreign banks; all sectors and currencies, local claims in foreign currency included): it counts long-term claims falling due within a year and only bank creditors, so it is not the economy's short-term external debt. The reserve base is net reserves, IMF IRFCL official reserve assets (Section I) plus the predetermined net drains within one year (Section II: forwards and swaps falling due, scheduled debt service), at the quarter-end month, never below a tenth of gross reserves (Turkey's net reserves were below zero in 2023 Q2; a floored quarter is marked `a2_floored`). The floor belongs to A2 only: net reserves themselves, Section I plus Section II without the floor and possibly negative, are published as `res_net_raw`, and every page and the API call that value net reserves. A2 is scored only where reserves are the economy's last line of foreign-currency liquidity: not for a euro member, an issuer of a reserve currency (Japan, the UK) or an economy with a standing unlimited Fed swap line (Canada). Buffers: net IIP / GDP (IMF IIP) and the current account over four quarters / GDP (IMF BOP), quarterly where published, else the newest annual value at most four quarters old. Shown, not scored: A2 on gross reserves; A1 by nationality of issuer, with an offshore-issuance flag where it exceeds the cross-border residence figure by 5 points of GDP or is twice it; A3 = international debt securities by nationality / (those + LBS cross-border loans and deposits); and net external debt (IIP debt liabilities less debt assets with reserves) / GDP. Flows: B1 = the BIS FX- and break-adjusted change of cross-border loans and deposits, every sector and currency (interbank funding included, the channel of Korea in 2008); B2 = DSS net issues by nationality; flow score = (B1 + B2) / (the two stocks of the quarter before) × 4, in per cent, sign kept: below zero, non-resident banks and bondholders reduced their claims (a creditor withdrawal, not the balance of payments' net outflow, which includes residents' asset moves). B2 and its stock share the nationality basis because emerging-market firms issue through offshore affiliates; B1 and its stock share the LBS residence basis, the only one with adjusted changes. The score is one ratio, (B1 + B2) / (LBS cross-border loans and deposits + international debt securities by nationality, both a quarter before), not each flow against its own stock. An economy-quarter is drawn when A1, A2 where scored and a buffer exist; a missing flow or A3 is marked, not a reason to leave the row out (method 1.6). Context beside A1: the BIS GLI credit to non-banks in US dollars, euros and yen, summed, the economy's own currency left out, where the BIS publishes the borrower series."
    ko: "차입 경제는 각자 자기 쪽 자료로 읽습니다. 점수를 매기는 익스포저는 다음과 같습니다. A1 = 비은행 앞 외화신용 / GDP이며, 차입자의 거주지 기준입니다. 거주자 비은행 앞 미 달러·유로·엔화 표시 국경 간 대출·예금(BIS LBS)에 두 가지를 더합니다. 하나는 해당 경제가 LBS에 보고하는 경우 경제 안 은행의 거주자 비은행 앞 외화 채권입니다(국내 포지션, 모든 외화·모든 상품, 부문 구분이 있는 유일한 공개 항목, 신호판 36개 경제 중 26개가 보고하며 나머지는 표시). 다른 하나는 거주자 비은행 발행자의 같은 통화 표시 국제채무증권(BIS DSS, 거주지 기준)입니다. 자국 통화는 제외하고, BIS 총신용에서 역산한 4개 분기 GDP로 나눕니다(최신 분기는 직전 분기 값을 씁니다). A2 = BIS 보고은행의 1년 이내 만기도래 채권 ÷ 외환보유액 기준값입니다. 분자는 잔존만기 1년 이하인 BIS CBS 국제 채권입니다(직접 거래상대방 기준, 은행 유형 4O, 역내 외국은행을 제외한 전체 보고은행, 모든 부문·통화, 외화 표시 현지 채권 포함). 1년 안에 만기가 돌아오는 장기 채권도 들어가고 채권자는 은행뿐이므로, 해당 경제의 단기외채가 아닙니다. 외환보유액 기준값은 순외환보유액입니다. 분기말 월의 IMF IRFCL 공식 준비자산(섹션 I)에 1년 이내 예정된 순유출(섹션 II, 만기가 돌아오는 선물환·스왑과 예정된 원리금 상환)을 더한 값이며, 총외환보유액의 10분의 1 아래로는 내려가지 않게 합니다(튀르키예의 순외환보유액은 2023년 2분기에 0 아래였습니다. 하한이 적용된 분기는 `a2_floored`로 표시합니다). 하한은 A2에만 적용합니다. 하한 없이 섹션 I과 섹션 II를 더한 순외환보유액 자체는 음수일 수 있으며 `res_net_raw`로 공개합니다. 모든 페이지와 API에서 이 값을 순외환보유액이라 부릅니다. A2는 외환보유액이 해당 경제의 마지막 외화유동성 방어선인 경우에만 점수를 매깁니다. 유로 회원국, 기축통화 발행국(일본, 영국), 연준과 상설 무제한 통화스왑 라인을 갖춘 경제(캐나다)는 제외합니다. 완충 지표는 순대외금융자산 / GDP(IMF IIP)와 4개 분기 경상수지 / GDP(IMF BOP)입니다. 분기 자료가 있으면 분기 자료를, 없으면 4개 분기 이내의 최신 연간 값을 씁니다. 점수 없이 보여 주는 지표는 네 가지입니다. 총외환보유액 기준 A2, 발행자 국적 기준 A1(국경 간 거주지 기준 수치를 GDP의 5%p 넘게 웃돌거나 그 두 배이면 역외 발행 표시), A3 = 국적 기준 국제채무증권 / (국적 기준 국제채무증권 + LBS 국경 간 대출·예금), 순대외채무(IIP 기준 대외채무에서 외환보유액을 포함한 대외채권을 뺀 값) / GDP입니다. 흐름 지표는 다음과 같습니다. B1 = 환율·단절 조정을 거친 BIS 국경 간 대출·예금 변동이며, 모든 부문·통화를 포함합니다(은행 간 자금 조달 포함, 2008년 한국이 겪은 경로). B2 = 국적 기준 DSS 순발행입니다. 흐름 점수 = (B1 + B2) / (직전 분기 두 잔액) × 4이며, % 단위로 부호를 유지합니다. 0보다 작으면 비거주자 은행과 채권투자자가 보유 채권을 줄였다는 뜻입니다. 이는 채권자의 자금 회수이며, 거주자의 자산 변동까지 포함하는 국제수지의 순유출과는 다릅니다. B2와 그 잔액은 국적 기준을 함께 씁니다. 신흥국 기업이 역외 계열사를 통해 발행하기 때문입니다. B1과 그 잔액은 LBS 거주지 기준을 함께 씁니다. 조정된 변동을 공개하는 유일한 기준이기 때문입니다. 점수는 하나의 비율, 곧 (B1 + B2) / (LBS 국경 간 대출·예금 + 국적 기준 국제채무증권, 둘 다 직전 분기)이며, 흐름 지표를 각각의 잔액으로 나누지 않습니다. 경제별 분기는 A1, 점수를 매기는 경우 A2, 완충 지표 하나 이상이 있을 때 그립니다. 흐름 지표나 A3가 없으면 표시만 하고 행을 빼지 않습니다(방법론 1.6). A1 옆 참고 지표는 BIS GLI의 미 달러·유로·엔화 표시 비은행 앞 신용 합계입니다. 자국 통화는 제외하며, BIS가 차입자 시계열을 공개하는 경우에만 보여 줍니다."
    why: {en: "Method 1.2 mixed bases (bonds by nationality over domestic GDP, so a US finance arm serviced from dollar revenue counted against its parent's home GDP), scored a bond share whose direction the validation contradicted, scored short-term bank debt against national reserves inside a currency union, and had no buffers: a net creditor with a current-account surplus ranked first. Residence matches the numerator to GDP; the buffers are the IMF's own external-sector measures and were already in the data hub. Residence and nationality A1 validated alike (docs/methodology/vulnerability-v1.3.md). Method 1.4, after the verification of 31 Oct 2026: gross reserves hid Turkey's and Argentina's position (predetermined drains of 40% and 32% of gross reserves at the latest quarter; net reserves below zero at their crisis dates), and the BIS global liquidity definition of foreign-currency credit includes the local foreign-currency loans the LBS already carried (Turkey's A1 doubles with them). Both were in the mirror (docs/methodology/vulnerability-v1.4.md).", ko: "1.2는 기준을 섞었습니다. 채권은 국적 기준으로, 분모는 국내 GDP로 썼습니다. 이 때문에 달러 수입으로 상환하는 미국 금융 자회사를 모회사 본국 GDP에 대응시켰습니다. 검증과 방향이 어긋나는 채권 비중을 점수로 넣었습니다. 통화동맹 안에서 단기 은행부채를 국가 준비자산과 비교했고, 완충은 넣지 않았습니다. 그래서 경상흑자를 기록하는 순채권국이 1위가 됐습니다. 거주성 기준이면 분자와 GDP의 범위가 같습니다. 완충은 IMF 자신의 대외부문 지표이며 자료 저장소에 이미 있었습니다. 거주지·국적 기준 A1의 검증 결과는 같았습니다(docs/methodology/vulnerability-v1.3.md). 1.4는 2026년 10월 31일 검증 뒤의 개정입니다. 총준비자산은 튀르키예와 아르헨티나의 처지를 가렸습니다. 최신 분기 예정된 유출은 총준비자산의 40%와 32%였고, 위기 시점에는 순준비자산이 0 아래였습니다. BIS 세계 유동성 정의의 외화신용에는 LBS가 이미 싣고 있던 국내 외화대출이 들어갑니다. 튀르키예의 A1은 이를 더하면 두 배입니다. 둘 다 미러에 있었습니다(docs/methodology/vulnerability-v1.4.md)."}
    papers: ["44537", "44633"]
    fn: rules.r17_indicators
    tests: [test_r17_indicators_and_drop_reason, test_r17_own_currency_not_foreign, test_r17_residence_buffers_and_a2_scope, test_r17_a2_uses_net_reserves, test_r17_a1_includes_local_fx_credit, test_r17_flow_components_share_basis, test_r17_offshore_gap_flag, test_r17_a1_break_marker_on_adoption, test_r17_net_reserves_raw, test_r17_missing_flow_keeps_row]
  R18:
    name: {en: Vulnerability score, ko: 취약성 점수}
    en: "Score = ½ × exposure + ½ × buffer weakness, on 0–100. Exposure is the mean of the scored exposures' signals (A1; A2 where scored). Each signal is ½ × level + ½ × own history. Level: the share of every board economy-quarter observed up to and including this quarter, all economies pooled, at or below this value. Own history: z = (value − the economy's own median) / max(1.4826 × MAD, floor), over its quarters from 2000 (or its first) up to and including this one, clipped to ±3 and mapped to 0–100 (50 = its own median); floors 1 point of GDP for A1 and 10 points of reserves for A2, so a narrow history cannot turn a small move into an extreme. A1's own history compares like with like (method 1.6): an economy whose A1 has had the same composition in every quarter so far, with or without the local foreign-currency claims (`a1_local`, R17), reads its A1; once the composition has changed at least once up to the quarter, it reads the cross-border-only A1, value and history alike, the one composition every quarter has (`o1x`). An economy that starts or stops reporting the local part therefore does not read the switch as a move of its own (Malaysia 2024 Q1, Russia 2015 Q4 and 2022 Q1, Sweden 2023). The level pool mixes economies with the local part and those without it (cross-border only, LIMIT on A1's local component): their levels are compared as published. Buffer weakness: the mean of 100 − level for net IIP / GDP and for the current account / GDP, of those published for the quarter; a buffer is read as a level only, because its own history carried no information in the validation and a buffer's level is what the IMF's external assessments read. The A2 pool holds scored A2 values only: a euro member's, Japan's, the UK's or Canada's A2 ranks no one. An indicator needs 8 quarters of history, the pool 40 observations. Every window is expanding: a past quarter's score uses only quarters up to it, its own and every other economy's. The score is not a ranking; the flow score is not transformed."
    ko: "점수 = ½ × 노출도 + ½ × 완충력 취약도이며, 0–100 범위입니다. 노출도는 점수에 반영되는 노출 지표 신호의 평균입니다(A1, 점수에 반영되는 경우 A2). 각 신호는 ½ × 수준 + ½ × 자체 이력입니다. 수준은 이번 분기까지 관측된 신호판 전체 국가·분기 관측치 가운데 이 값 이하인 관측치의 비중입니다. 모든 국가를 한 표본으로 합쳐 계산합니다. 자체 이력은 z = (값 − 해당국 자체 중앙값) / max(1.4826 × MAD, 하한)으로 산출합니다. 대상 기간은 2000년(또는 자료가 시작되는 분기)부터 이번 분기까지입니다. z는 ±3에서 자른 뒤 0–100으로 변환합니다(50 = 해당국 자체 중앙값). 하한은 A1이 GDP 대비 1포인트, A2가 외환보유액 대비 10포인트입니다. 이력의 변동 폭이 좁아도 작은 움직임이 극단값으로 나타나지 않게 하기 위해서입니다. A1의 자체 이력은 같은 구성끼리 비교합니다(방법론 1.6). 지금까지 모든 분기에서 A1 구성이 같았던 국가는 현지 외화채권(`a1_local`, R17) 포함 여부와 관계없이 A1을 그대로 씁니다. 이번 분기까지 구성이 한 번이라도 바뀐 국가는 값과 이력 모두 국경 간 채권만의 A1(`o1x`)을 씁니다. 모든 분기에 공통으로 있는 구성은 이것뿐이기 때문입니다. 따라서 현지 부분의 보고를 시작하거나 중단한 국가도 그 전환을 자체 변동으로 읽지 않습니다(말레이시아 2024년 1분기, 러시아 2015년 4분기와 2022년 1분기, 스웨덴 2023년). 수준 표본에는 현지 부분이 포함된 국가와 포함되지 않은 국가(국경 간 채권만, A1 현지 구성 요소의 LIMIT)가 섞여 있으며, 이들의 수준은 공표된 값 그대로 비교합니다. 완충력 취약도는 해당 분기에 공표된 순대외금융자산/GDP와 경상수지/GDP 각각의 (100 − 수준)을 평균한 값입니다. 완충 지표는 수준으로만 읽습니다. 검증에서 자체 이력이 아무 정보도 주지 못했고, IMF 대외부문 평가가 보는 것도 완충 지표의 수준이기 때문입니다. A2 표본에는 점수에 반영되는 A2 값만 포함합니다. 유로 회원국·일본·영국·캐나다의 A2는 다른 국가의 순위에 영향을 주지 않습니다. 지표에는 8개 분기의 이력이, 표본에는 40개의 관측치가 필요합니다. 모든 창은 확장 창입니다. 과거 분기의 점수는 해당국과 다른 모든 국가 모두 그 분기까지의 자료만 씁니다. 이 점수는 순위가 아니며, 유량 점수는 변환하지 않습니다."
    why: {en: "Method 1.2 ranked each indicator against the economy's own past only: magnitude was ignored (Korea and Italy had nearly the same A2 at the 97th and 6th percentiles), a calm narrow history pushed small moves to the extremes, and the score separated stress episodes from calm quarters no better than chance (area under the ROC curve 0.51 on 27 named episodes, 0.45 against a mechanical currency-crash dating). Levels against peers, own history with a floor, and buffers gave 0.67 and 0.60, the best of twelve candidates tested point in time; the result is in the decision memo with every candidate.", ko: "1.2는 지표마다 그 경제 자신의 과거와만 비교했습니다. 크기는 무시했습니다(한국과 이탈리아는 A2가 거의 같았지만 백분위는 각각 97과 6이었습니다). 조용하고 좁은 이력은 작은 움직임을 극단으로 밀었고, 점수는 충격 사례와 평온한 분기를 우연보다 낫게 가르지 못했습니다(이름 붙은 27개 사례에서 ROC 곡선 아래 면적 0.51, 기계적 통화 폭락 시점에 대해 0.45). 다른 경제와 비교한 수준, 하한 있는 자기 과거, 완충을 함께 쓰니 0.67과 0.60으로, 시점 기준으로 시험한 12개 후보 가운데 가장 좋았습니다. 후보 전부와 결과는 결정 메모에 있습니다."}
    fn: rules.r18_signals
    tests: [test_r18_robust_z_floor, test_r18_level_signal_pooled, test_r18_score_arithmetic, test_r18_no_look_ahead, test_r18_snapshot_2026q2, test_r18_buffer_uses_configured_measure, test_r18_pool_excludes_unscored_a2, test_r18_a1_own_history_same_composition]
  R19:
    name: {en: The board's economies, ko: 신호판의 경제}
    en: "Every economy with a GDP denominator in BIS total credit, except the United States (the hub, not a borrower in this sense), the BIS offshore centres (Hong Kong SAR, Singapore), the fund domiciles already flagged (Luxembourg, Ireland, the Netherlands, Switzerland) and the euro-area aggregate (its members are shown one by one; the euro is their own currency from the day they adopted it). Japan and the UK issue reserve currencies and Canada has a standing unlimited Fed swap line: they are on the board, with A2 shown but not scored (R17). An economy-quarter without its scored components (A1, A2 where scored) or a buffer is not drawn and is logged with its reason (V18); one without a flow score is drawn with its vulnerability score, off the flow axis, and listed with the reason (method 1.6). The board is therefore 36 economies, the advanced and the larger emerging ones that BIS total credit covers; frontier borrowers (Egypt, Pakistan, Sri Lanka, Ghana, Kenya) are outside it. The fund-domicile exclusion is the audit's FD tag (R10): Belgium, a settlement centre, stays. The euro adoption dates come from config/economies.csv (Croatia 2023-01-01, Bulgaria 2026-01-01), and the board file names each member's date so the page can mark the break in A1."
    ko: "BIS 총신용에 GDP 분모가 있는 모든 경제를 포함합니다. 다만 미국(이 의미의 차입자가 아니라 중심지), BIS 역외금융센터(홍콩 특별행정구, 싱가포르), 이미 표시한 펀드 소재지(룩셈부르크, 아일랜드, 네덜란드, 스위스), 유로지역 합계는 제외합니다. 유로지역 회원국은 하나씩 표시하며, 유로는 도입일부터 회원국의 자국 통화입니다. 일본과 영국은 기축통화 발행국이고, 캐나다는 연준과 상설 무제한 통화스왑 라인을 갖추고 있습니다. 세 경제는 신호판에 포함되지만 A2는 표시만 하고 점수를 매기지 않습니다(R17). 점수 구성요소(A1, 점수를 매기는 경우 A2)나 완충 지표가 없는 경제별 분기는 그리지 않고 사유와 함께 기록합니다(V18). 흐름 점수가 없는 경제별 분기는 취약성 점수와 함께 흐름 축 밖에 그리고 사유와 함께 표시합니다(방법론 1.6). 따라서 신호판은 BIS 총신용이 포괄하는 선진국과 규모가 큰 신흥국 36개 경제로 이뤄집니다. 프런티어 차입국(이집트, 파키스탄, 스리랑카, 가나, 케냐)은 포함되지 않습니다. 펀드 소재지 제외는 감사의 FD 태그(R10)를 따르며, 결제 중심지인 벨기에는 남깁니다. 유로 도입일은 config/economies.csv에서 가져옵니다(크로아티아 2023-01-01, 불가리아 2026-01-01). 신호판 파일에 회원국별 도입일을 담아 페이지가 A1의 단절을 표시할 수 있게 합니다."
    why: {en: "The IMF WEO is not in the data hub; BIS total credit gives a quarterly GDP for 43 economies, the same source family as the indicators.", ko: "IMF WEO는 자료 저장소에 없습니다. BIS 총신용은 43개 경제의 분기 GDP를 지표와 같은 출처 계열에서 제공합니다."}
    fn: rules.r19_economy_set
    tests: [test_r19_exclusions, test_r19_euro_adoption_dates]

  # ---- method 1.5 (2 Nov 2026): the export surface
  R20:
    name: {en: One pulse, one change feed, ko: 맥박과 변화는 한 번만}
    en: "The World pulse and the change feed are computed once, at release, from the board history the release itself carries, and are published as files (world/global pulse; changes/global). No page and no downstream site recomputes them: a reader of money-flow, of global-network or of an article sees the same tiles and the same list for a given release. The change feed compares the newest board quarter with the one before, economy by economy: entering or leaving the at-risk corner (score 60 or more with a creditor withdrawal, flow below zero), a flow score changing sign (with B1 and B2 of the new quarter), A2 crossing 100% of net reserves (with its basis), and a score moving 10 points or more. The values are the board's published columns, so the feed and the board cannot disagree."
    ko: "세계 맥박과 변화 목록은 릴리스를 만들 때 한 번만 계산합니다. 릴리스에 담긴 신호판 이력에서 구해 파일(world/global의 pulse, changes/global)로 냅니다. 어떤 페이지도, 뒤에서 읽는 어떤 사이트도 다시 계산하지 않습니다. money-flow든 global-network든 기사든 같은 릴리스를 보는 독자는 같은 타일과 같은 목록을 봅니다. 변화 목록은 신호판의 최신 분기를 직전 분기와 경제별로 비교합니다. 위험 구석(점수 60 이상에 채권자 이탈, 곧 자금흐름 0 미만)에 들어오거나 나간 경제, 자금흐름 점수의 부호가 바뀐 경제(새 분기의 B1·B2와 함께), A2가 순준비자산의 100%를 넘나든 경제(기준과 함께), 점수가 10점 넘게 움직인 경제를 적습니다. 값은 신호판이 낸 열 그대로라 목록과 신호판이 어긋날 수 없습니다."
    why: {en: "Until 2 Nov 2026 global-network recomputed the pulse and the changes from money-flow's files (refurbish plan, WP1): two sites could say different things about one release, and a change of rounding or threshold on one side would not show on the other.", ko: "2026년 11월 2일까지 global-network가 money-flow 파일에서 맥박과 변화를 다시 계산했습니다(개편 계획 WP1). 같은 릴리스를 두고 두 사이트가 다른 말을 할 수 있었고, 한쪽에서 반올림이나 기준을 바꿔도 다른 쪽에는 드러나지 않았습니다."}
    fn: rules.r20_changes
    tests: [test_r20_changes_kinds, test_r20_changes_published_once]
  R21:
    name: {en: Cut a lender, ko: 대출국 하나가 대출을 줄이면}
    en: "First-round arithmetic on published figures, for every board economy at the newest BIS quarter: each reporting banking system's share of the all-reporter loans and deposits on the economy (BIS LBS, residence basis, loans and deposits as R5 defines the bank channel), in per cent of the all-reporter total, with reporters that hold less than 0.05 bn left out and the BIS aggregates never counted as a lender (R11). Reporters that publish all instruments only for the economy, with no loans-and-deposits split (R5: Japan, Germany and others), are listed apart as reported for all instruments only, with their all-instrument amount; they have no share, because their loans and deposits are not published, which is not the same as none (method 1.6). The loss when a lender cuts a share of its claims is cut share × lender share × bank claims, in US dollar billions, and is shown against the economy's net reserves: IRFCL Section I plus Section II from the Signal Board, without A2's floor (R17; absent where the board has none, and no ratio where net reserves are zero or below). Nothing else moves: no price, no replacement lender, no second round. The release carries the shares, the all-instrument amounts, the claims and the net reserves; the browser only multiplies by the chosen cut."
    ko: "공개된 수치로 하는 1차 계산이며, 최신 BIS 분기의 신호판 모든 경제가 대상입니다. 각 보고국 은행시스템이 해당 경제 앞 전체 보고국 대출·예금(BIS LBS, 거주지 기준, R5가 은행 경로로 정의한 대출·예금)에서 차지하는 비중을 전체 보고국 합계 대비 %로 계산합니다. 보유액이 0.05 bn 미만인 보고국은 빼고, BIS 합계는 대출기관으로 세지 않습니다(R11). 해당 경제에 대해 모든 상품 합계만 공개하고 대출·예금 구분이 없는 보고국(R5, 일본·독일 등)은 '모든 상품 기준으로만 보고'로 따로 표시하고 모든 상품 금액을 함께 보여 줍니다. 이들의 대출·예금은 공개되지 않았을 뿐 없는 것이 아니므로 비중을 매기지 않습니다(방법론 1.6). 대출기관이 채권의 일부를 회수할 때의 손실은 회수 비율 × 대출기관 비중 × 은행 채권이며, 10억 달러 단위입니다. 이 손실은 해당 경제의 순외환보유액과 비교해 보여 줍니다. 순외환보유액은 신호판의 IRFCL 섹션 I과 섹션 II를 더한 값이며 A2의 하한을 적용하지 않습니다(R17). 신호판에 값이 없으면 비워 두고, 순외환보유액이 0 이하이면 비율을 내지 않습니다. 그 밖에는 아무것도 바뀌지 않습니다. 가격 변화, 대체 대출기관, 2차 효과는 반영하지 않습니다. 릴리스에는 비중, 모든 상품 금액, 채권, 순외환보유액이 담기고, 브라우저는 선택한 회수 비율을 곱하기만 합니다."
    why: {en: "The lender-cut scenario (S4) ran on global-network until 2 Nov 2026 on money-flow's data alone; it is money-side arithmetic and belongs beside the bank matrix (refurbish plan, WP4). Shares of the all-reporter total, not of the bilateral sum, so an economy whose lenders are largely unallocated shows small shares rather than inflated ones.", ko: "대출자 끊기 시나리오(S4)는 2026년 11월 2일까지 global-network에서 money-flow 자료만으로 돌아갔습니다. 돈 쪽의 셈법이라 은행 행렬 옆에 둡니다(개편 계획 WP4). 양자 합계가 아니라 전체 보고국 합계 대비 비중을 쓰므로, 대출자가 대부분 미배분인 경제는 부풀린 비중이 아니라 작은 비중으로 나타납니다."}
    fn: rules.r21_lender_cut
    tests: [test_r21_lender_cut_shares_and_loss, test_r21_all_instrument_reporters_apart]
  # The seven sovereign rules (the Sovereign section, view sovereign/global). Their defaults, slider ranges, sources and
  # the validation windows are config/sovereign.yaml (r1..r7 = R22..R28); the `sovereign` field here repeats the default
  # and the direction, and tests/test_sovereign.py fails when the two files differ. The signal is a COUNT of rules that
  # are on, shown as k of n available; a rule that is missing or not applicable is never counted as off. Nothing in
  # R22–R28 enters the Signal Board's score or flow (R17, R18). The WEO's publication year and the next are projections:
  # drawn dashed, never counted in the validation (V24, V25).
  R22:
    name: {en: Sovereign 1. Debt level, ko: 국가 재정 1. 국가채무 수준}
    en: "General government gross debt over GDP, IMF World Economic Outlook (GGXWDG_NGDP), latest vintage, one value a year from 1990. On at 90% of GDP or more; adjustable on the page between 30 and 200 in steps of 5. The threshold is a convention (the level Reinhart and Rogoff made famous), not a limit."
    ko: "일반정부 총부채를 GDP로 나눈 값입니다. IMF 세계경제전망(WEO, GGXWDG_NGDP) 최신 판, 1990년부터 연도별 한 값입니다. GDP의 90% 이상이면 신호가 발생합니다. 페이지에서 30부터 200까지 5 단위로 바꿀 수 있습니다. 기준치는 관행(라인하트와 로고프로 널리 알려진 수준)이며, 넘으면 안 되는 한도는 아닙니다."
    why: {en: "More debt means more to roll over each year and less room in a shock. The WEO is the one source with the same definition for all 36 economies back to 1990.", ko: "부채가 많을수록 해마다 만기가 도래하는 채무가 많고, 충격을 흡수할 재정여력은 줄어듭니다. WEO는 36개 경제 모두에 1990년까지 같은 정의로 값을 제공하는 유일한 자료입니다."}
    sovereign: {id: r1, default: 90, dir: ge, unit: pct_gdp, source: "convention (Reinhart-Rogoff 90% debt level)"}
    fn: sovereign.r22_debt_level
    tests: [test_r22_r23_pass_through_and_threshold]
  R23:
    name: {en: Sovereign 2. Deficit, ko: 국가 재정 2. 재정적자}
    en: "General government net lending (+) or borrowing (−) over GDP, interest included, IMF WEO (GGXCNL_NGDP). On at −5% of GDP or below; adjustable between −15 and 0 in steps of 0.5. The EU's Maastricht reference is −3%; −5% marks a large deficit."
    ko: "일반정부 순대출(+)·순차입(−)을 GDP로 나눈 값이며 이자가 포함됩니다. 자료는 IMF WEO(GGXCNL_NGDP)입니다. GDP의 −5% 이하면 신호가 발생합니다. −15부터 0까지 0.5 단위로 바꿀 수 있습니다. EU 마스트리히트 기준은 −3%이고, −5%는 큰 적자를 나타냅니다."
    why: {en: "A deficit has to be borrowed, so a large one adds to debt fast.", ko: "적자는 차입으로 메워야 하므로 적자가 크면 부채가 빨리 늘어납니다."}
    sovereign: {id: r2, default: -5, dir: le, unit: pct_gdp, source: "convention (the EU Maastricht limit is 3%; 5% marks a large deficit)"}
    fn: sovereign.r23_deficit
    tests: [test_r22_r23_pass_through_and_threshold]
  R24:
    name: {en: Sovereign 3. Debt snowball, ko: 국가 재정 3. 부채 눈덩이}
    en: "The primary balance that would hold the debt ratio steady, less the actual primary balance, in points of GDP, from WEO ratios and GDP in levels: interest paid = (primary balance − overall balance) / 100 × GDP; the effective rate i = interest / last year's debt (last year's ratio × last year's GDP); nominal growth g = GDP / last year's GDP − 1; debt-stabilising primary balance pb* = last year's debt ratio × (i − g) / (1 + g); gap = pb* − primary balance. On at 1 point of GDP or more; adjustable between −2 and 6 in steps of 0.5. Missing when any input is missing."
    ko: "채무 비율을 그대로 유지하는 데 필요한 기초재정수지에서 실제 기초재정수지를 뺀 값입니다. 단위는 GDP의 %p입니다. WEO 비율과 GDP 수준값으로 산출합니다. 이자지출 = (기초재정수지 − 통합재정수지) / 100 × GDP. 실효금리 i = 이자지출 / 지난해 채무(지난해 비율 × 지난해 GDP). 명목 성장률 g = GDP / 지난해 GDP − 1. 채무 안정 기초재정수지 pb* = 지난해 채무 비율 × (i − g) / (1 + g). 차이 = pb* − 기초재정수지. GDP의 1%p 이상이면 신호가 발생합니다. −2부터 6까지 0.5 단위로 바꿀 수 있습니다. 입력값이 하나라도 없으면 값을 산출하지 않습니다."
    why: {en: "If interest beats growth, debt grows by itself unless the budget saves before interest; a gap of 1% of GDP a year adds about 10 points of GDP to debt in a decade. Greece 2009 by hand: i 4.52%, g −1.85%, pb* 7.20%, gap 17.5 points (tests/test_sovereign.py).", ko: "금리가 성장률을 웃돌면 기초재정수지 흑자를 내지 않는 한 부채는 저절로 늘어납니다. 해마다 GDP의 1% 차이는 10년이면 채무를 GDP의 10%p쯤 늘립니다. 2009년 그리스를 손으로 계산하면 i 4.52%, g −1.85%, pb* 7.20%, 차이 17.5%p입니다(tests/test_sovereign.py)."}
    sovereign: {id: r3, default: 1, dir: ge, unit: pct_gdp, source: "convention (a gap of 1% of GDP a year adds about 10 points of GDP to debt in a decade)"}
    fn: sovereign.r24_debt_snowball
    tests: [test_r24_snowball_round_numbers, test_r24_snowball_greece_2009_by_hand, test_r24_snowball_missing_input]
  R25:
    name: {en: Sovereign 4. Current account, ko: 국가 재정 4. 경상수지}
    en: "The three-year average of the current account balance over GDP. Each year's value is the Signal Board's own four-quarter current account at the fourth quarter (R17, IMF BOP) where the board has that year, else the WEO's annual figure (BCA_NGDPD); the source of each year is recorded and shown beside the value on the page and in the API, and the average exists only when all three years do. On at −4% of GDP or below; adjustable between −12 and 0 in steps of 0.5 (the EU macroeconomic imbalance procedure's threshold)."
    ko: "GDP 대비 경상수지의 3년 평균입니다. 각 연도 값은 신호판에 그해 자료가 있으면 4분기 시점의 신호판 4개 분기 경상수지(R17, IMF BOP)를, 없으면 WEO 연간 수치(BCA_NGDPD)를 씁니다. 연도별 출처는 기록해 페이지와 API에서 값 옆에 보여 줍니다. 평균은 세 해 값이 모두 있을 때만 냅니다. GDP 대비 −4% 이하에서 켜지며, −12에서 0까지 0.5 단위로 조정할 수 있습니다(EU 거시경제 불균형 절차의 기준)."
    why: {en: "A persistent deficit is financed from abroad; three years smooth a commodity swing. The board's figure is preferred so the Sovereign section and the Signal Board read one number where both have it.", ko: "지속되는 적자는 해외에서 메웁니다. 3년 평균은 원자재 가격의 출렁임을 고릅니다. 둘 다 값이 있는 해에는 국가 재정 부문과 신호판이 같은 숫자를 읽도록 신호판 값을 먼저 씁니다."}
    sovereign: {id: r4, default: -4, dir: le, unit: pct_gdp, source: "EU macroeconomic imbalance procedure (MIP) scoreboard"}
    fn: sovereign.r25_current_account
    tests: [test_r25_current_account_three_year_average]
  R26:
    name: {en: Sovereign 5. Net IIP, ko: 국가 재정 5. 순대외금융자산}
    en: "The net international investment position over GDP at the year end: the Signal Board's net IIP at the fourth quarter (R17, IMF IIP over BIS-implied GDP) where the board has the year, else IMF IIP total assets less liabilities over the WEO's GDP in US dollars (NGDPD); the source of each year is recorded and shown beside the value on the page and in the API; projection years are left empty. On at −35% of GDP or below; adjustable between −150 and 0 in steps of 5 (the EU macroeconomic imbalance procedure's threshold)."
    ko: "연말 기준 GDP 대비 순대외금융자산입니다. 신호판에 그해 자료가 있으면 4분기 시점의 신호판 순대외금융자산(R17, IMF IIP를 BIS 기준 역산 GDP로 나눈 값)을, 없으면 IMF IIP 총자산에서 총부채를 뺀 값을 WEO의 미 달러 기준 GDP(NGDPD)로 나눈 값을 씁니다. 연도별 출처는 기록해 페이지와 API에서 값 옆에 표시하며, 전망 연도는 비워 둡니다. GDP 대비 −35% 이하에서 발생하며, −150에서 0까지 5 단위로 조정할 수 있습니다(EU 거시경제 불균형 절차의 기준)."
    why: {en: "A large net debtor position is what past deficits left behind; it is the buffer the Signal Board also reads (R18), here as a level against a fixed line.", ko: "큰 순채무 잔액은 과거 적자가 남긴 것입니다. 신호판도 읽는 완충(R18)이며, 여기서는 고정된 기준치와 비교한 수준으로 봅니다."}
    sovereign: {id: r5, default: -35, dir: le, unit: pct_gdp, source: "EU macroeconomic imbalance procedure (MIP) scoreboard"}
    fn: sovereign.r26_net_iip
    tests: [test_r26_net_iip_board_first_then_imf]
  R27:
    name: {en: Sovereign 6. Liquidity (A2), ko: 국가 재정 6. 유동성(A2)}
    en: "The Signal Board's A2 at the fourth quarter: BIS banks' claims due within a year (CBS international claims with remaining maturity up to one year, all currencies) ÷ A2's reserve base (net reserves, IRFCL Section I plus Section II, floored at a tenth of gross reserves; R17), in per cent. Not applicable where the board does not score A2 (euro members, Japan, the UK, Canada), and greyed throughout for an economy whose newest quarter is unscored; missing before 2005 and in projection years. On at 100% or more; adjustable between 25 and 400 in steps of 5 (the Greenspan–Guidotti rule: reserves should cover debt falling due within a year)."
    ko: "4분기 시점의 신호판 A2입니다. BIS 보고은행의 1년 이내 만기도래 채권(잔존만기 1년 이하 CBS 국제 채권, 모든 통화)을 A2의 외환보유액 기준값으로 나눈 값이며, % 단위입니다. 외환보유액 기준값은 IRFCL 섹션 I과 섹션 II를 더한 순외환보유액이며, 총외환보유액의 10분의 1을 하한으로 둡니다(R17). 신호판이 A2에 점수를 매기지 않는 경제(유로 회원국, 일본, 영국, 캐나다)에는 적용하지 않고, 최신 분기에 점수가 없는 경제는 전 기간을 회색으로 표시합니다. 2005년 이전과 전망 연도는 값이 없습니다. 100% 이상에서 켜지며, 25에서 400까지 5 단위로 조정할 수 있습니다(그린스펀·기도티 규칙, 외환보유액이 1년 안에 만기가 돌아오는 채무를 감당해야 한다는 규칙)."
    why: {en: "Bank claims falling due within a year above reserves are the classic run exposure (Korea 1997, Türkiye 2018). The claims include those in the borrower's own currency, so the rule reads them as short-term bank funding, not as foreign-currency debt; the Signal Board already builds A2 on its reserve base, so the Sovereign section reads the same column.", ko: "1년 안에 만기가 돌아오는 은행 채권이 외환보유액보다 많으면 대규모 자금 이탈에 노출되는 전형적인 경우입니다(1997년 한국, 2018년 튀르키예). 이 채권에는 차입국 자국 통화 표시분도 포함되므로, 이 규칙은 이를 외화부채가 아니라 단기 은행 자금 조달로 읽습니다. 신호판이 이미 외환보유액 기준값으로 A2를 산출하므로 Sovereign 섹션도 같은 열을 읽습니다."}
    sovereign: {id: r6, default: 100, dir: ge, unit: pct, source: "Greenspan-Guidotti rule (reserves should cover debt falling due within a year); A2 as method 1.4 (R17)"}
    fn: sovereign.r27_liquidity
    tests: [test_r27_liquidity_not_applicable_where_unscored]
  R28:
    name: {en: Sovereign 7. Spread, ko: 국가 재정 7. 스프레드}
    en: "The 10-year government bond yield less the benchmark's, OECD long-term interest rates via FRED (IRLTLT01{iso2}M156N, monthly averages): Germany is the benchmark for EU members, the United States for the rest, and the benchmark itself is not applicable. The annual value is the average of the monthly spreads of the months both series have, at least six; the newest value is the average of the last twelve months when the series ends within two months of the newest month any economy has. Only the spread is published, never a yield series. On at 4 points or more; adjustable between 1 and 10 in steps of 0.5 (400 basis points, a common distress marker)."
    ko: "10년 만기 국채 수익률에서 기준국 수익률을 뺀 값입니다. OECD 장기금리를 FRED에서 읽습니다(IRLTLT01{iso2}M156N, 월 평균). EU 회원국의 기준국은 독일, 나머지 경제는 미국이며, 기준국 자체에는 적용하지 않습니다. 연간 값은 두 계열이 모두 있는 달의 월간 스프레드 평균이며, 최소 여섯 달이 있어야 합니다. 최신 값은 마지막 열두 달 평균이며, 계열이 어느 경제의 최신 달에서 두 달 안에 끝나야 씁니다. 스프레드만 공표하고 수익률 계열은 공표하지 않습니다. 4%p 이상이면 신호가 발생합니다. 1부터 10까지 0.5 단위로 바꿀 수 있습니다(400bp, 흔히 쓰는 위기 표지)."
    why: {en: "The market's own price of sovereign risk, available monthly where the fiscal data are annual; Russia's series stops in 2018, so a stale spread is shown as missing, not as calm.", ko: "시장이 매기는 국가 위험의 값이며, 재정 자료가 연간일 때 달마다 있습니다. 러시아의 계열은 2018년에 멈추므로 오래된 스프레드는 평온이 아니라 없음으로 표시합니다."}
    sovereign: {id: r7, default: 4, dir: ge, unit: pp, source: "convention (400 basis points, a common distress marker)"}
    fn: sovereign.r28_spread
    tests: [test_r28_spread_needs_six_months_and_benchmark]
checks:
  V1:  {name: {en: Unique keys, ko: 키 유일성}, en: "No key repeats in any table or site file (R12).", ko: "어떤 표나 사이트 파일에서도 키가 반복되지 않습니다(R12).", tolerance: exact, severity: block}
  V2:  {name: {en: One row per ribbon, ko: 리본마다 한 행}, en: "Each ribbon comes from exactly one total row (R2, R3, R4).", ko: "리본마다 총계 행 하나에서 나옵니다(R2, R3, R4).", tolerance: exact, severity: block}
  V3:  {name: {en: Adds up, ko: 합계 일치}, en: "At every node, the identified parts plus 'not identified' equal the total (R6).", ko: "모든 노드에서 확인된 부분과 미확인의 합이 총계와 같습니다(R6).", tolerance: "1e-6 bn", severity: block}
  V4:  {name: {en: Coverage, ko: 포괄률}, en: "The identified share per economy and channel, shown in each view; below 50% is a warning.", ko: "경제·경로별 확인 비율을 화면마다 표시합니다. 50% 미만이면 경고합니다.", tolerance: "warn below 50%", severity: warn}
  V5:  {name: {en: Two sources agree, ko: 두 출처 일치}, en: "The same quantity from two publishers agrees within tolerance: national series against BIS or the IMF, and official reserves in the IIP against IRFCL for every economy (3% to pass, a warning to 10%, failure above: the two series are revised on different dates; listed definitional exemptions as information); Korea's IIP portfolio from ECOS against the IMF IIP (0.1%, the same compiler); CPIS holder totals against IIP portfolio assets (10%, warning); the DIP all-investor total against IIP direct liabilities and TIC against CPIS, which differ by valuation or custodial basis (information).", ko: "두 기관이 공표한 같은 수치가 허용 범위 안에서 일치하는지 확인합니다. 각국 통계와 BIS·IMF 통계, 모든 경제의 IIP 준비자산과 IRFCL을 비교합니다. IRFCL 비교는 3%까지 통과, 10%까지 경고, 그 위는 실패입니다. 두 계열의 수정 시점이 다릅니다. 정의가 다른 예외는 참고로 둡니다. 한국 ECOS IIP 증권투자와 IMF IIP(0.1%, 같은 작성기관), CPIS 보유국 합계와 IIP 증권투자 자산(10%, 경고), DIP 전체 투자국 합계와 IIP 직접투자 부채, TIC와 CPIS(평가·보관 기준이 달라 참고)도 비교합니다.", tolerance: "3% (10%) / 0.1% / 10%", severity: block}
  V6:  {name: {en: Mirrors, ko: 상대국 통계 비교}, en: "The investor's and the host's reports of one pair differ by less than 50%, or the pair is flagged 'reports disagree'.", ko: "한 짝에 대한 투자국과 투자 대상국 보고의 차이가 50% 미만이어야 하며, 넘으면 '보고 불일치'로 표시합니다.", tolerance: "50%", severity: flag}
  V7:  {name: {en: Publisher totals, ko: 발표 총계}, en: "Our sums against the publisher's own totals: GLI loans plus securities equal the total; the LBS sum over single counterparties stays at or below all countries; the five IIP items, derivatives with their sign, equal the total (a shortfall means a missing item and is information).", ko: "우리 합계를 발표기관 총계와 대조합니다. GLI 대출과 채권의 합이 총계와 같고, LBS 개별 상대국 합이 전체 국가 값 이하이며, 부호를 살린 파생상품을 포함한 IIP 다섯 항목의 합이 총계와 같습니다. 합이 모자라면 항목이 빠진 것이므로 참고로 표시합니다.", tolerance: "0.5% + 0.1 bn", severity: block}
  V8:  {name: {en: Golden figures (regression), ko: 기준 수치(회귀)}, en: "The Korea figures in the plan (27 Oct 2026 vintages) are rebuilt exactly. This is a regression test of the build, not a validation: the figures were written down from the same tables. Validation against independent figures is V5 and V16.", ko: "계획서의 한국 수치(2026년 10월 27일 판)를 정확히 다시 산출합니다. 같은 표에 적어 둔 수치이므로 이 점검은 빌드의 회귀 점검이며 검증이 아닙니다. 독립된 수치와의 검증은 V5와 V16입니다.", tolerance: exact, severity: block}
  V9:  {name: {en: Determinism, ko: 결정성}, en: "Two builds from the same mirror give byte-identical files.", ko: "같은 미러로 두 번 빌드하면 파일이 바이트 단위로 같습니다.", tolerance: "exact hash", severity: block}
  V10: {name: {en: Explained change, ko: 변화의 근거}, en: "Every mark that differs from the previous release has a new source vintage behind it (R15).", ko: "이전 릴리스와 달라진 표시값마다 새 출처 판이 있습니다(R15).", tolerance: exact, severity: block}
  V11: {name: {en: Licence, ko: 라이선스}, en: "No source of a class that may not be shown, no field outside the mark schema, no fund-level value, and no native daily, weekly or monthly series longer than 13 observations in any public file. One exception (method 1.2): the World pulse's open series (Fed H.4.1 and H.10 via FRED) carry 53 weekly points for their sparklines. The views of the export surface (method 1.5: earn, changes, episodes, sovereign) pass the same gate under their own schemas and a licence check on the datasets they carry; the sovereign view's monthly yield spread is a derived difference of two public-domain series, not a copy of either.", ko: "공개 파일에는 표시 불가 등급의 출처, 스키마 밖 필드, 펀드 단위 값, 13개 관측치를 넘는 일·주·월 원계열이 없습니다. 예외가 하나 있습니다(방법론 1.2). 세계 맥박의 공개 계열(FRED 경유 연준 H.4.1·H.10)은 작은 추이선용으로 주간 53개 점을 싣습니다. 공개 표면의 화면 자료(방법론 1.5: earn, changes, episodes, sovereign)도 자기 스키마와 싣는 자료의 라이선스 점검으로 같은 관문을 통과합니다. 국가 재정 자료의 월간 금리 스프레드는 퍼블릭 도메인 계열 둘의 차이로 만든 파생값이며, 어느 쪽의 복사본도 아닙니다.", tolerance: "exact (53 weekly points for the pulse)", severity: block}
  V12: {name: {en: Freshness, ko: 최신성}, en: "Each dataset's newest period is within its cadence plus the publisher's usual lag.", ko: "자료마다 최신 기간이 주기와 통상 발표 지연 안에 있습니다.", tolerance: "per cadence", severity: warn}
  V13: {name: {en: Size of change, ko: 변동 크기}, en: "Tenfold moves between two periods, after the R16 quarantine. A quarantined or rescaled source error is a warning with its raw values; a segment that starts within a month of a listed currency redenomination (config/redenominations.csv) is a warning to check the source's back-conversion; a real or unexplained move is information; a unit-error pattern still in a drawn series blocks the release.", ko: "R16 격리 뒤에 남은 두 기간 사이 10배 변동입니다. 격리되거나 되돌린 원자료 오류는 원값과 함께 경고로 표시합니다. 정해 둔 화폐 단위 변경일(config/redenominations.csv)의 한 달 안에 시작하는 구간은 출처의 환산을 확인하라는 경고로 표시합니다. 실제 변동이거나 설명되지 않은 변동은 참고로 표시합니다. 그려진 시계열에 단위 오류 패턴이 남아 있으면 릴리스를 막습니다.", tolerance: "10x", severity: block}
  V14: {name: {en: CPIS within the IIP, ko: CPIS가 IIP 안에}, en: "The holders identified on an economy (reporting holders plus the reserves-and-IO group) do not exceed its IIP portfolio liabilities, by instrument, by more than 5%. A warning where the excess is known and persistent (valuation or coverage bases differ: India, Bermuda, the UK); an economy that exceeds for the first time blocks the release.", ko: "한 경제에 대해 확인된 보유분(보고 보유국과 준비자산·국제기구 집단)이 상품별 IIP 증권투자 부채를 5% 넘게 초과하지 않습니다. 알려진 지속적 초과(평가·포괄 기준이 다른 인도, 버뮤다, 영국)는 경고로 처리합니다. 처음 초과하는 경제는 릴리스를 막습니다.", tolerance: "5%", severity: block}
  V15: {name: {en: Bank loans within IIP other investment, ko: 은행 대출이 IIP 기타투자 안에}, en: "BIS all-reporter loans and deposits on an economy do not exceed its IIP loans plus deposits liabilities. Exceptions are scope differences and are listed.", ko: "BIS 전체 보고국의 대출·예금 청구권은 그 경제의 IIP 대출·예금 부채를 넘지 않습니다. 예외는 범위 차이이며 목록으로 표시합니다.", tolerance: "0.5% + 0.1 bn", severity: warn}
  V16: {name: {en: Publisher identities, ko: 발표기관 항등식}, en: "Identities on the publishers' own data, exact: the BIS all-reporter figure is never below the sum of its bilateral reporters; the IMF's derived portfolio liability of an economy equals the sum of what reporting holders and the reserves-and-IO group hold. Independent of anything written down by hand.", ko: "발표기관 자료 자체의 항등식(정확한 관계)입니다. BIS 전체 보고국 값은 개별 보고국 합보다 작지 않습니다. IMF가 공표한 한 경제의 파생 증권투자 부채는 보고 보유국과 준비자산·국제기구 집단 보유분의 합과 같습니다. 이 관계는 손으로 적어 둔 수치와 무관합니다.", tolerance: "0.1 bn", severity: block}
  V17: {name: {en: Source links, ko: 출처 링크}, en: "Every source a page names comes from the source registry: each panel's link ids exist, and each entry has a label and a name in both languages and the publisher's URL.", ko: "페이지가 밝히는 출처는 모두 출처 등록부에 있습니다. 패널마다 링크 id가 등록부에 있고, 항목마다 두 언어의 약칭·이름과 발표기관 주소가 있습니다.", tolerance: exact, severity: block}
  V18: {name: {en: Complete board, ko: 신호판 완결성}, en: "Every economy drawn on the Signal Board in a quarter has its scored exposures (A1; A2 where scored) with their signals, at least one buffer and its score; one without a flow score is drawn as scored and listed with the reason, and a flow always has B1 and B2 behind it. An economy without a scored component or a buffer is not drawn, never shown with zeros, and is listed with its reason.", ko: "분기마다 신호판에 표시되는 모든 경제에는 점수가 산출된 노출 지표(A1, 점수가 있으면 A2)와 그 신호, 완충 지표 하나 이상, 점수가 있습니다. 자금흐름 점수가 없는 경제도 점수가 산출된 경제로 표시하고, 그 이유를 목록에 적습니다. 자금흐름 점수에는 언제나 B1과 B2가 뒷받침됩니다. 점수가 산출된 구성요소나 완충 지표가 없는 경제는 표시하지 않습니다. 0으로 채워 표시하지 않고 이유와 함께 목록에 올립니다.", tolerance: exact, severity: block}
  V19:
    name: {en: Adjusted flows, ko: 조정 흐름}
    en: "B1 is the BIS FX- and break-adjusted change, not the difference of two positions: one economy's value for one quarter is compared with the value read from the BIS (stats.bis.org, the series behind the Statistics Explorer). A BIS revision of that quarter shows here and calls for a new reading."
    ko: "B1은 두 잔액의 차이가 아니라 BIS가 발표하는 환율·단절 조정 변동입니다. 한 경제의 한 분기 값을 BIS에서 직접 읽은 값(stats.bis.org, 통계 탐색기의 원계열)과 대조합니다. BIS가 그 분기를 수정하면 이 점검에서 드러나며, 값을 새로 읽어야 합니다."
    tolerance: "0.5%"
    severity: warn
    reference: {economy: KOR, key: "WS_LBS_D_PUB Q.F.C.G.TO1.A.5J.A.5A.A.KR.N", period: "2026-06-30", previous: "2026-03-31", value_mn: -2165.606, read: "2026-10-30", url: "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_LBS_D_PUB/1.0/Q.F.C.G.TO1.A.5J.A.5A.A.KR.N"}
  V20: {name: {en: Disjoint instruments, ko: 겹치지 않는 상품}, en: "International debt securities (BIS DSS) and cross-border loans and deposits (BIS LBS instrument G) are the two parts of A3's denominator (A3 is context since method 1.3) and of the flow score; no series is used in both, and LBS all instruments (which include banks' holdings of debt securities) is never used.", ko: "국제채권(BIS DSS)과 국경 간 대출·예금(BIS LBS 상품 G)은 A3 분모(1.3부터 참고 지표)와 자금흐름 점수를 이루는 두 부분입니다. 한 계열을 양쪽에 쓰지 않습니다. 은행의 채권 보유분이 들어 있는 LBS 전체 상품은 쓰지 않습니다.", tolerance: exact, severity: block}
  V21: {name: {en: Pulse freshness, ko: 맥박 최신성}, en: "Each weekly or daily pulse tile's newest value is at most 10 days old at build time; an older tile shows a stale warning. TIC is monthly and follows V12.", ko: "주간·일간 맥박 타일의 최신 값은 빌드 시점에 10일 이내입니다. 더 오래되면 타일에 경고를 붙입니다. TIC는 월간 자료이므로 V12를 따릅니다.", tolerance: "10 days", severity: warn}
  V22: {name: {en: No extreme from a tiny move, ko: 작은 움직임은 극단값이 아닙니다}, en: "The score cannot reach 0 or 100 from a tiny move in a narrow history: every own-history signal's scale is at least its floor (A1 1 point of GDP, A2 10 points of reserves), and a signal at 0 or 100 sits at least three floors from the economy's own median. Recomputed from the published columns.", ko: "좁은 이력의 작은 움직임으로 점수가 0이나 100에 닿지 않습니다. 자기 과거 신호마다 척도는 하한(A1은 GDP의 1%p, A2는 준비자산의 10%p) 이상이고, 0이나 100인 신호는 자기 중앙값에서 하한의 세 배 이상 떨어져 있습니다. 공개된 열로 다시 계산합니다.", tolerance: "floor", severity: block}
  # method 1.5 (2 Nov 2026): the earnings frame and the sovereign validation. Information or warnings, never blocking.
  V23: {name: {en: Quarterly frame against WDI, ko: 분기 자료와 WDI 대조}, en: "For every economy of the earnings view and each quarterly series (exports and imports of goods and services, net primary income, GDP), the calendar-year sums of the IMF quarterly series, converted at the BIS quarterly average rate where the unit is not the dollar, are compared with the World Bank WDI annual figure: the unit whose median ratio over the overlapping years is nearest one is chosen, and the series passes when that ratio is within 3% of one. A failing economy-series is listed as withheld: a reader of earn/global must not draw it (India's QNEA GDP, whose fiscal-year quarters do not sum to the WDI calendar year, fails and is withheld).", ko: "소득 자료의 경제마다, 분기 계열(상품·서비스 수출입, 본원소득수지, GDP)마다 IMF 분기 계열의 역년 합계를 세계은행 WDI 연간 값과 비교합니다. 단위가 달러가 아니면 BIS 분기 평균 환율로 환산합니다. 겹치는 해의 비율 중앙값이 1에 가장 가까운 단위를 고릅니다. 이 비율이 1에서 3% 이내면 통과입니다. 통과하지 못한 경제·계열은 제외된 항목으로 기록합니다. earn/global을 읽는 쪽은 이 계열을 그리면 안 됩니다(인도의 QNEA GDP는 회계연도 기준 분기이므로 WDI 역년 합계와 맞지 않아 통과하지 못하고 제외합니다).", tolerance: "3% (median ratio)", severity: warn}
  V24: {name: {en: Sovereign hit and false-signal rates, ko: 국가 재정 적중률과 거짓 신호율}, en: "With the default thresholds and K = 4 rules on, the share of distress spells (IMF arrangements, euro-area and EU programmes, defaults; config/sovereign_episodes.yaml, spells merged within a year) with an alert in the one to three years before their start, and the share of calm years (more than three years from any episode of that economy, outside 2008, 2009 and 2020) with an alert. Projection years and years with no rule available are left out. Reported as information: the numbers are what they are, and the page shows them.", ko: "기본 기준값과 K = 4개 규칙 기준으로, 위기 사례(IMF 약정, 유로지역·EU 프로그램, 채무불이행. config/sovereign_episodes.yaml, 1년 안의 사례는 하나로 합침) 가운데 시작 1~3년 전에 신호가 있었던 비율을 구합니다. 평온한 해(그 경제의 어떤 사례에서도 3년 넘게 떨어지고 2008·2009·2020년이 아닌 해) 가운데 신호가 있었던 비율도 구합니다. 전망 연도와 쓸 수 있는 규칙이 없는 해는 제외합니다. 이 결과는 참고용으로 적습니다. 숫자는 있는 그대로이며 페이지에 표시합니다.", tolerance: "none (reported)", severity: info}
  V25: {name: {en: Sovereign AUROC, ko: 국가 재정 AUROC}, en: "The area under the ROC curve of the rule count, the pre-episode years against the calm years of V24, with ties counted half. 0.5 is chance. Below 0.5 the check warns: the count then separates the two sets no better than a coin, and the page must say so. It never blocks: the Sovereign section is a structured reading of published thresholds, not a forecast.", ko: "규칙 수의 ROC 곡선 아래 면적입니다. V24의 사례 이전 연도를 평온한 해와 비교하고, 동점은 절반으로 계산합니다. 0.5는 무작위 수준입니다. 0.5를 밑돌면 경고합니다. 이때 규칙 수는 두 집합을 동전 던지기보다 낫게 가르지 못합니다. 페이지가 이를 명시해야 합니다. 릴리스는 막지 않습니다. 국가 재정 부문은 발표된 기준값을 정리해 보여주는 것이지 예측이 아닙니다.", tolerance: "warn below 0.5", severity: warn}
  V26: {name: {en: Sovereign expectations, ko: 국가 재정 기대 점검}, en: "The expectations written down before the section was built (config/sovereign.yaml `expectations`: Greece 2008–09, Argentina 1999–2000 and Portugal 2009–10 reach four rules; Korea 1996 is flagged by the liquidity rule; Greece 2025 has the debt and net IIP rules on and the deficit and snowball rules off) are recomputed on every release and each is reported pass or fail. A failure warns and the page prints it; it never blocks, because an expectation that fails is a finding about the rules, not an error of the build.", ko: "부문을 만들기 전에 기대를 config/sovereign.yaml의 `expectations`에 적어 둡니다. 기대는 2008~09년 그리스, 1999~2000년 아르헨티나, 2009~10년 포르투갈은 규칙 넷에 이르고, 1996년 한국은 유동성 규칙에서 신호가 발생하며, 2025년 그리스는 국가채무와 순대외금융자산 규칙에서 신호가 발생하고 재정적자와 눈덩이 규칙에서는 발생하지 않는다는 내용입니다. 이 기대를 릴리스마다 다시 계산해 하나하나 통과·실패로 적습니다. 실패는 경고이며 페이지에 그대로 싣습니다. 릴리스는 막지 않습니다. 어긋난 기대는 빌드의 오류가 아니라 규칙에 대한 발견이기 때문입니다.", tolerance: "exact", severity: warn}
  V27: {name: {en: "Net reserves and A2's reserve base", ko: "순외환보유액과 A2의 외환보유액 기준은 따로 관리합니다. 외환보유액이 있는 신호판의 모든 행에서 res_net_raw는 IRFCL 제I부와 제II부의 합입니다(제II부가 공표되지 않으면 비워 둡니다). A2의 외환보유액 기준은 이 값과 같습니다. 다만 하한이 적용되면 해당 행에 a2_floored 표시를 하고, 기준을 총외환보유액의 10분의 1로 잡습니다. 이때 기준은 순외환보유액보다 큽니다. 채권자별 화면도 신호판과 같은 값을 씁니다."}, en: "Net reserves and A2's reserve base are kept apart. On every Signal Board row with reserves, res_net_raw equals IRFCL Section I plus Section II (empty where Section II is not published); A2's reserve base equals it unless the floor binds, and then the row is flagged a2_floored and the base is a tenth of gross reserves, above net reserves. The lender cut carries the board's value.", ko: "순외환보유액과 A2의 외환보유액 기준", tolerance: "0.01 bn", severity: block}

# Definitions shown on the Method page and in the Notes under each view.
definitions:
  position: {en: "The stock outstanding at the end of a period, at market or book value as the source reports it.", ko: "기말 잔액입니다. 금액은 출처가 보고한 시장가치 또는 장부가치입니다."}
  flow: {en: "The change over a period: a published transaction, or the difference of two positions (then valuation changes are mixed in).", ko: "기간 중 변화를 나타냅니다. 발표된 거래이거나 두 시점 잔액의 차이입니다. 잔액 차이인 경우 평가 변동이 섞입니다."}
  residence: {en: "Positions assigned to the economy where the holder or the bank office is located.", ko: "보유자나 은행 점포가 소재한 경제에 귀속한 잔액."}
  nationality: {en: "Bank positions assigned to the economy where the bank's parent is headquartered (BIS CBS).", ko: "은행 모회사의 본사 소재 경제에 귀속한 은행 잔액(BIS CBS)."}
  coverage: {en: "The share of an economy's total for a channel that pair data identify by counterparty.", ko: "경제의 경로별 총계 가운데 짝 자료로 상대국이 확인되는 비율."}
  financial_centre: {en: "An economy whose external positions are large relative to its GDP; holdings there often belong to investors elsewhere. The BIS offshore centres carry the tag FC; Luxembourg, Ireland, the Netherlands and Switzerland, where funds are domiciled, carry FD: a holder there is a fund domicile, not an end investor.", ko: "GDP에 비해 대외 잔액이 큰 경제입니다. 이런 경제의 보유분은 다른 나라 투자자의 것인 경우가 많습니다. BIS 역외금융센터에는 FC, 펀드가 설립되는 룩셈부르크, 아일랜드, 네덜란드, 스위스에는 FD를 붙입니다. 이들 경제의 보유국은 펀드 소재지이며 최종투자자가 아닙니다."}
  reserves_io: {en: "The IMF's confidential group of securities held as reserve assets (SEFER) and by international organisations (SSIO), published by issuer only in aggregate.", ko: "준비자산으로 보유한 증권(SEFER)과 국제기구가 보유한 증권(SSIO)으로 구성된 IMF 비공개 집단입니다. 발행국별 집계로만 공개됩니다."}
  ultimate_risk: {en: "BIS CBS positions assigned to the economy of the party that ultimately bears the risk (a guarantor or a head office), after risk transfers.", ko: "위험 이전 뒤에 최종적으로 위험을 지는 쪽(보증인이나 본점)의 경제에 귀속한 BIS CBS 잔액."}
  vulnerability: {en: "The Signal Board's x axis (method 1.6, R18): ½ × exposure (FX credit to GDP and, where scored, BIS banks' claims due within a year to A2's reserve base, each read half against every board economy so far and half against the economy's own past) + ½ × buffer weakness (net IIP and the current account to GDP, against every board economy so far). 0–100; not a ranking.", ko: "신호판의 가로축입니다(방법론 1.6, R18). ½ × 노출 + ½ × 완충력 약화로 산출합니다. 노출은 GDP 대비 외화신용과, 점수가 있으면 A2의 외환보유액 기준 대비 BIS 은행의 잔존만기 1년 이내 채권입니다. 각 지표는 절반은 지금까지의 모든 신호판 경제와, 절반은 해당 경제의 과거와 비교해 평가합니다. 완충력 약화는 GDP 대비 순대외금융자산과 경상수지를 지금까지의 모든 신호판 경제와 비교해 평가합니다. 값은 0~100 범위이며 순위가 아닙니다."}
  gross_liabilities: {en: "Gross external (financial) liabilities: everything residents owe to or have issued to non-residents in the IMF IIP, at market value, equity included: portfolio equity and direct investment equity rise with domestic stock prices, which is not borrowing. The debt part is portfolio debt, other investment and direct investment debt instruments.", ko: "대외금융부채(총액)는 IMF IIP에서 거주자가 비거주자에게 부담한 부채와 발행한 증권 전부를 시가로 평가한 값이며 지분을 포함합니다. 증권투자 주식과 직접투자 지분은 국내 주가가 오르면 늘지만 차입이 아닙니다. 채무성은 증권투자 채권, 기타투자, 직접투자 채무상품입니다."}
  niip: {en: "Net international investment position: external financial assets less liabilities, both at market value. Above zero, a net creditor to the rest of the world.", ko: "순대외금융자산(순국제투자)은 대외금융자산에서 대외금융부채를 뺀 값입니다. 둘 다 시가 기준입니다. 0보다 크면 한국은 세계에 대해 순채권국입니다."}
  flow_score: {en: "The Signal Board's y axis: the quarter's bank (B1) and bond (B2) flows into the economy over the stock of the quarter before, annualised, in per cent. Below zero: non-resident banks and bondholders reduced their claims (a creditor withdrawal), which is not the balance of payments' net outflow.", ko: "신호판의 세로축입니다. 그 분기 은행(B1)·채권(B2) 유입액을 직전 분기말 잔액으로 나눠 연율화한 백분율입니다. 0보다 작으면 비거주 은행과 채권 보유자가 청구권을 줄였음을 나타냅니다(채권자 이탈). 이는 국제수지의 순유출과 다릅니다."}
  layer: {en: "Core money (central bank), bank money (deposits), and derived claims (securities, funds), after PLAN.md.", ko: "본원통화(중앙은행), 은행 통화(예금), 파생 청구권(증권, 펀드)."}

# "What this page can and cannot see": the World page's Signal Board, shown on the Method page (method 1.2).
limits:
  - {en: "Portfolio investment has no statistics by nationality: the IMF's portfolio data (PIP, formerly CPIS) assign holdings to the economy where the holder resides, often a fund domicile or an offshore centre. The Signal Board therefore looks only from the borrower's side and does not claim to identify final investors.", ko: "증권투자에는 국적 기준 통계가 없습니다. IMF 증권투자 자료(PIP, 옛 CPIS)는 보유분을 보유자가 거주하는 경제에 귀속합니다. 그 경제는 흔히 펀드 소재지나 역외금융센터입니다. 그래서 신호판은 차입국 쪽에서만 보고하며, 최종투자자를 식별한다고 주장하지 않습니다."}
  - {en: "Layer B (bank and bond flows) arrives two to four months after the quarter ends. Layer C, the weekly pulse, exists to fill that gap; it is global, not per country.", ko: "B층(은행·채권 흐름)은 분기가 끝나고 2~4개월 뒤에 나옵니다. C층인 주간 맥박은 그 공백을 메우려고 둡니다. 경제별이 아니라 세계 전체 지표입니다."}
  - {en: "BIS LBS adjusted changes approximate flows: they remove exchange-rate moves and reported breaks, but valuation changes, write-downs, unreported breaks and the timing of exchange-rate conversion still leak in. LBS is by residence of the lending bank, which is the only basis with adjusted changes.", ko: "BIS LBS 조정 변동은 흐름의 근사치입니다. 환율 변동과 보고된 단절은 제외했지만 가치 변동, 상각, 보고되지 않은 단절, 환산 시점 차이는 포함됩니다. LBS는 대출 은행의 소재지 기준입니다. 조정 변동이 있는 기준은 이것뿐입니다."}
  - {en: "The score (R18) is validated on 27 named external-stress episodes since 2006 and a mechanical currency-crash dating, point in time but on the newest data vintages, not the figures known at the time: revisions are not replayed. The design was chosen as the best of the candidates on this sample, in sample: with 27 episodes the bootstrap 90% interval of the area under the ROC curve is about ±0.1 wide, so candidates within a few hundredths of each other are not distinguished, and the decision memo publishes the intervals and the episode list. Early warning is weak in general: the score is a structured reading, not a forecast. Euro-area sovereign stress in 2010–12 is out of scope: it was a domestic-currency debt crisis inside a currency union.", ko: "점수(R18)는 2006년 이후 이름 붙은 대외 충격 27건과 기계적 통화 폭락 시점으로 검증했습니다. 시점 기준이지만 자료는 최신 판이라 당시 알려진 수치가 아니며, 수정 이력은 재현하지 않습니다. 설계는 이 표본에서 후보 가운데 가장 나은 것을 고른 것이라 표본 안의 선택입니다. 사례 27건으로는 ROC 곡선 아래 면적의 부트스트랩 90% 구간이 약 ±0.1 폭이라, 몇백분의 일 차이의 후보는 가려지지 않습니다. 결정 메모에 구간과 사례 목록을 싣습니다. 조기경보는 대체로 약합니다. 점수는 예측이 아니라 정리된 읽기입니다. 2010~12년 유로지역 정부부채 위기는 범위 밖입니다. 통화동맹 안의 자국 통화 부채 위기였습니다."}
  - {en: "A1 is gross foreign-currency debt, not net of foreign-currency assets or hedges: economies whose companies earn or hold foreign currency (the UK, Canada, Australia, Chile) look more exposed than their net currency position. A2's numerator, BIS banks' claims due within a year, includes claims in the borrower's own currency and long-term claims falling due within a year, so it is not short-term foreign-currency debt. Korea's A2 rose in 2026 Q2 because these claims rose from 192.6 to 241.9 bn. By sector of the immediate counterparty (all maturities, bank type 4O), claims on non-financial corporations rose by 58.4 bn (114.7 to 173.1 bn), on non-bank financial institutions by 8.4 bn, on the official sector by 5.3 bn and on banks by 2.8 bn: the rise was in claims on companies, not on the government. CBS is consolidated, so a foreign branch's borrowing from its head office is not in A2: Korea's 2008 squeeze ran largely through that channel, and the score missed it.", ko: "A1은 총외화부채이며 외화자산이나 헤지를 차감하지 않습니다. 그래서 기업이 외화를 벌거나 보유하는 경제(영국·캐나다·호주·칠레)는 순통화포지션보다 더 많이 노출된 것처럼 보입니다. A2의 분자인 BIS 은행의 잔존만기 1년 이내 채권에는 차입자 자국 통화로 된 채권과 1년 안에 만기가 돌아오는 장기 채권이 포함됩니다. 따라서 단기 외화부채가 아닙니다. 2026년 2분기 한국의 A2가 오른 것은 이 채권이 192.6에서 241.9(10억 달러)로 늘었기 때문입니다. 직접 거래상대방 부문별로 보면(전체 만기, 은행 유형 4O) 비금융기업에 대한 채권이 58.4(114.7에서 173.1로) 늘었습니다. 비은행 금융기관에 대한 채권은 8.4, 공공부문에 대한 채권은 5.3, 은행에 대한 채권은 2.8 늘었습니다(10억 달러). 증가분은 정부가 아니라 기업에 대한 채권에서 나왔습니다. CBS는 연결 기준이므로 외국은행 지점이 본점에서 차입한 금액은 A2에 포함되지 않습니다. 2008년 한국의 외화 자금난은 주로 이 경로로 일어났고, 점수는 이를 잡아내지 못했습니다."}
  - {en: "Net IIP moves with stock prices: equity liabilities are at market value, so a domestic rally lowers the net position without any borrowing (Korea's fell from 48% of GDP at end-2025 to 4% in 2026 Q2 as the KOSPI rose 68% in the quarter). The validation favoured net IIP over net external debt as a buffer; net external debt is shown beside it.", ko: "순대외금융자산은 주가를 따라 움직입니다. 지분성 부채가 시가 기준이어서 국내 주가가 오르면 새로운 차입 없이도 순대외금융자산이 줄어듭니다. 한국의 순대외금융자산은 GDP 대비 2025년 말 48%에서 2026년 2분기 4%로 낮아졌고, 그 분기 KOSPI는 68% 올랐습니다. 검증에서는 완충 지표로 순대외채무보다 순대외금융자산이 나았습니다. 순대외채무는 옆에 표시합니다."}
  - {en: "A1's local component is the BIS LBS local-position cell for non-banks in all foreign currencies and all instruments, because the loans-only cell by currency is not published with a sector split; it is missing for the ten board economies that do not report to the LBS (Argentina, China, Colombia, Czechia, Hungary, Israel, New Zealand, Poland, Thailand, and Russia after 2021), whose A1 is cross-border only and marked. The local cell covers all foreign currencies and all instruments, while the cross-border loans and the bonds are in US dollars, euros and yen only. A resident non-bank's international bond held by a bank inside the economy is in both the local cell and the bond part, so A1 can count it twice. The level pool mixes economies with and without the local part; A1's own history never mixes the two (R18). Where the BIS GLI publishes a borrower series, its credit in US dollars, euros and yen (the own currency left out) is shown beside A1.", ko: "A1의 국내 부분은 BIS LBS 국내 포지션 가운데 비은행, 전체 외화, 전체 금융상품 항목을 씁니다. 통화별 대출 항목은 부문별로 나눠 공표되지 않기 때문입니다. LBS에 보고하지 않는 신호판 경제 10곳(아르헨티나·중국·콜롬비아·체코·헝가리·이스라엘·뉴질랜드·폴란드·태국, 2021년 이후의 러시아)은 이 항목이 없습니다. 이들 경제의 A1은 국경 간 부분만 담으며 따로 표시합니다. 국내 항목은 모든 외화와 모든 금융상품을 포괄하지만, 국경 간 대출과 채권은 미 달러·유로·엔화만 포함합니다. 거주자 비은행이 발행한 국제채권을 국내 은행이 보유하면 국내 항목과 채권 부분에 모두 들어가므로 A1에 두 번 집계될 수 있습니다. 수준 비교 집단에는 국내 부분이 있는 경제와 없는 경제가 섞여 있습니다. 반면 A1의 자기 과거 비교에서는 둘을 섞지 않습니다(R18). BIS GLI가 차입자 시계열을 공표하는 경우에는 미 달러·유로·엔화 신용(자국 통화 제외)을 A1 옆에 함께 표시합니다."}
  - {en: "A2's denominator is net of the predetermined drains the IRFCL template lists (Section II); contingent drains (Section III) and reserves that are frozen or encumbered but still in Section I (Russia since 2022) are not netted, since only an override could, and none is applied.", ko: "A2의 분모는 IRFCL 양식이 적는 예정된 유출(II부)을 뺀 값입니다. 우발 유출(III부)과 동결·담보 상태이지만 I부에 남아 있는 준비자산(2022년 이후 러시아)은 빼지 않습니다. 이 항목들을 빼려면 수작업 예외가 필요하며, 현재는 적용하지 않습니다."}
  - {en: "For banking centres among advanced economies (Japan, the UK, France, Belgium) B1 moves with interbank and intragroup funding, which is not a sudden stop in the emerging-market sense.", ko: "선진국 은행 중심지(일본, 영국, 프랑스, 벨기에)에서 B1은 은행 간·그룹 내 자금과 함께 움직입니다. 신흥국에서 말하는 자본유입 급정지와는 다릅니다."}

# Where the site uses nationality or ultimate-risk data instead of residence (method 1.2), each with its reason.
# The standing rule for the flow sites, the API and the desk (17 Nov 2026): datasteg need not match other aggregations of the same data, but it must be consistent with itself.
standing:
  - {id: C1, name: {en: "One quantity, one definition", ko: "이름이 붙은 지표(은행 대출·예금, 1년 안에 만기가 돌아오는 BIS 은행 채권, 순외환보유액, GDP, 성장률)는 어디에 나오든 하나의 규칙으로 산출합니다. 모든 페이지, API, 데스크, 두 언어 모두 같습니다. money-flow는 공용 지표 등록부(family/measures.json)에서 이름과 정의를 가져와 각 지표를 등록부 이름으로 공표합니다."}, en: "A named quantity (bank loans and deposits, BIS banks' claims due within a year, net reserves, GDP, growth) is computed by one rule wherever it appears: every page, the API, the desk, both languages. money-flow takes the names and definitions from the shared measures registry (family/measures.json) and publishes each under its registry name.", ko: "지표 하나, 정의 하나"}
  - {id: C2, name: {en: "One period rule for joins", ko: "저량은 분기 말 값을 쓰고, 유량은 그 분기 마지막 달에 끝나는 12개월 창을 씁니다(최대 6개월 앞선 창까지 쓰며 부분 기간으로 표시합니다). 결합한 값에는 두 기간을 모두 표시합니다."}, en: "A stock is taken at a quarter end; a flow is the twelve-month window ending in that quarter's last month (up to six months earlier, marked partial). Every joint value carries both periods.", ko: "결합에 쓰는 단일 기간 규칙"}
  - {id: C3, name: {en: "Like with like", ko: "두 계열은 범위(데이터셋, 기준, 만기 개념, 상품, 부문, 통화)가 같을 때만 더하거나 빼고, 비교하거나 비율로 산출합니다. 차이 자체가 지표의 요점이고 그 차이를 밝힌 경우는 예외입니다."}, en: "Two series are added, subtracted, compared or put in a ratio only when their scope is the same (dataset, basis, maturity concept, instruments, sectors, currencies), or when the difference is the point of the measure and is stated.", ko: "같은 기준끼리 비교"}
  - {id: C4, name: {en: "Every number carries its rule", ko: "독자나 API 이용자가 숫자를 보는 곳에는 언제나 그 숫자의 기간·창·기준이 함께 있습니다. 캡션, 주석 또는 필드로 영어와 한국어 모두에 표시합니다."}, en: "Wherever a reader or an API user sees a number, its period, window and basis are next to it: a caption, a note or a field, in English and Korean.", ko: "모든 숫자에는 산출 기준이 붙습니다"}
  - {id: C5, name: {en: "Checks, not hopes", ko: "위의 각 원칙마다 빌드 중에 실행되는 검사가 있으며, 원칙에 어긋나면 빌드가 실패합니다. 예를 들어 money-flow의 V27은 순외환보유액이 섹션 I과 섹션 II의 합인지, 하한이 A2의 기준값에만 적용되는지 검사합니다."}, en: "Each rule above has a check that runs in the build and fails it (on money-flow, for example, V27: net reserves are section I + section II, and only A2's base carries the floor).", ko: "기대가 아닌 검사"}

switches:
  - {en: "Method 1.3: A1 is scored by residence of the issuer (BIS DSS by residence), so the numerator and GDP cover the same economy; A1 by nationality is shown beside it, the gap being issuance by offshore affiliates, and from method 1.4 an offshore flag marks a gap of 5 points of GDP or a nationality figure twice the residence one (China 2021: 5.4% against 1.7%).", ko: "방법론 1.3에서는 A1을 발행자 거주성 기준(BIS DSS 거주성 기준)으로 점수에 넣어 분자와 GDP의 범위를 맞춥니다. 국적 기준 A1은 옆에 표시하고, 그 차이는 해외 계열사 발행분입니다. 1.4부터는 GDP의 5%p 차이나 거주성 기준의 두 배에 역외 발행 표시를 붙입니다(2021년 중국 5.4% 대 1.7%)."}
  - {en: "Debt securities (A3, B2): BIS DSS by nationality of issuer, not residence. Offshore affiliates issue almost a third of international debt securities; nationality puts a Brazilian company's Cayman issue back in Brazil.", ko: "채권(A3, B2)은 거주성 기준이 아니라 발행자 국적 기준 BIS DSS를 씁니다. 국제채권의 3분의 1 가까이를 역외 계열사가 발행합니다. 국적 기준이면 브라질 기업의 케이맨 발행분이 브라질로 돌아옵니다."}
  - {en: "Bank exposure (the board's hover): BIS CBS foreign claims on an ultimate-risk basis, so a loan guaranteed by a parent abroad counts where the risk lies. Short-term claims (A2) stay on the immediate-counterparty basis, the only one with a maturity breakdown.", ko: "은행 익스포저(신호판 설명창)는 최종위험 기준 BIS CBS 대외채권입니다. 해외 모회사가 보증한 대출은 위험을 부담하는 경제에 계상합니다. 단기 청구권(A2)은 만기 구분이 있는 유일한 기준인 직접 상대방 기준을 그대로 씁니다."}
  - {en: "Bank flows (B1, A3): BIS LBS by residence, because adjusted changes exist only there. Banks' offshore affiliates account for over 40% of cross-border bank lending, so the lender's location is often a centre; the board uses only the borrower's side, where residence and the borrower coincide.", ko: "은행 흐름(B1, A3)은 조정 변동이 이 자료에만 있어 거주성 기준 BIS LBS를 씁니다. 국경 간 은행 대출의 40% 넘게를 은행 역외 계열사가 차지해 대출자 소재지는 흔히 금융중심지입니다. 신호판은 차입국 쪽만 쓰는데, 그쪽에서는 거주성 기준과 차입자가 일치합니다."}
  - {en: "The Economy tab is unchanged: its own residence/nationality switch keeps residence as the default.", ko: "경제 탭은 바꾸지 않았습니다. 그 탭의 거주성/국적 전환은 거주성 기준이 기본입니다."}
