# The method registry. The rules R1–R28 and the checks V1–V27, with their statements in
# English and Korean. scripts/sitebuild/rules.py and sovereign.py register one function per rule (@rule("R4")) and
# scripts/sitebuild/verify.py one per check (@check("V3")); the build stops when a rule or check here has no function, a
# function names an id that is not here, or a rule lists no test that exists in tests/. The Method and Checks pages and
# every release manifest are written from this file, so the text and the code cannot drift apart. Changing any rule
# raises `version`.

version: "1.6"
date: 2026-11-17
changelog:
  - {version: "1.6", date: 2026-11-17, en: "After the consistency plan of 17 Nov 2026 (global-network/docs/CONSISTENCY-PLAN.html, D6, D8–D11): R17 publishes net reserves without the floor (res_net_raw, IRFCL Section I + II, may be negative) beside A2's reserve base, which alone keeps the floor and its flag; A2 is named BIS banks' claims due within a year ÷ reserve base; a missing flow or A3 no longer drops a board row, it is marked; the GLI context sums US dollar, euro and yen credit. R18: A1's own history only across quarters of the same composition (with or without the local part), else on the cross-border-only A1; method 1.2's context score is removed. R21 lists the reporters without a loans-and-deposits split apart with their all-instrument amount and sets losses against net reserves without the floor. R5: the derivatives-and-other pool is context, no longer set against the IIP derivatives item. Check V27 added. Scores move where a flow was missing or A1's composition switched.", ko: "2026년 11월 17일 일관성 계획(global-network/docs/CONSISTENCY-PLAN.html, D6, D8~D11) 반영. R17: 하한을 적용하지 않은 순외환보유액(res_net_raw, IRFCL 섹션 I + II, 음수 가능)을 A2의 외환보유액 기준값과 나란히 공개, 하한과 그 표시는 A2에만 유지. A2 명칭을 'BIS 보고은행의 1년 이내 만기도래 채권 ÷ 외환보유액 기준값'으로 변경. 흐름 지표나 A3가 없는 경우 신호판 행을 제외하지 않고 표시. GLI 참고 지표는 미 달러·유로·엔화 신용의 합계. R18: A1 자체 이력은 구성이 같은 분기(국내 부분 포함 여부 동일)끼리만 비교, 그 밖에는 국경 간 A1만 사용. 방법론 1.2의 참고 점수 삭제. R21: 대출·예금 구분이 없는 보고국은 모든 상품 금액과 함께 별도 표시, 손실은 하한을 적용하지 않은 순외환보유액과 비교. R5: 파생상품·기타 풀은 참고 지표로만 표시, IIP 파생상품 항목과의 비교 중단. 검증 V27 추가. 흐름 지표가 없었거나 A1 구성이 바뀐 경우 점수 변동."}
  - {version: "1.5", date: 2026-11-02, en: "The export surface of the refurbish plan of 2 Nov 2026 (WP1, WP2, WP4, D3 option a): money-flow publishes what global-network used to compute from its files, and collects what it used to fetch. New views, each gated and checked like the others and listed in surface.json (surface 1.0): earn/global (World Bank WDI annual and IMF BOP, QNEA and BIS XRU quarterly earnings series, fetched by scripts/fetch_wdi.py and fetch_quarterly.py), changes/global (R20), episodes/global (the validation set of methods 1.3 and 1.4) and sovereign/global (the Sovereign section, R22–R28, fetched by scripts/fetch_warning.py); mkt/bank gains lender_cut (R21). Rules: R20 the pulse and the change feed are published once at release and never recomputed downstream; R21 the lender-cut arithmetic; R22–R28 the seven sovereign rules (debt level, deficit, debt snowball, current account, net IIP, liquidity = A2, spread) with their defaults from config/sovereign.yaml. Checks: V23 the quarterly frame against WDI within 3% (India's QNEA GDP fails and is withheld); V24–V26 the sovereign validation (hit and false-signal rates, AUROC, the pre-written expectations), information or warnings, never blocking. V11 notes the one monthly derived series the sovereign view carries (the yield spread). No earlier rule changed; the Signal Board's score and flow are untouched.", ko: "2026년 11월 2일 개편 계획(WP1, WP2, WP4, D3의 (a))의 공개 표면. global-network가 money-flow 파일로 다시 계산하던 것을 money-flow가 직접 낸다. global-network가 받아오던 자료도 money-flow가 받아온다. 새 화면 자료는 다른 것과 같이 관문과 점검을 거치고 surface.json(표면 1.0)에 적는다. earn/global(세계은행 WDI 연간 자료와 IMF BOP·QNEA, BIS XRU 분기 소득 계열. scripts/fetch_wdi.py와 fetch_quarterly.py가 받는다), changes/global(R20), episodes/global(방법론 1.3·1.4의 검증 사례), sovereign/global(국가 재정 부문, R22–R28. scripts/fetch_warning.py가 받는다). mkt/bank에는 lender_cut(R21) 추가. 규칙: R20 맥박과 변화 목록은 릴리스 때 한 번만 계산하고 뒤에서 다시 계산하지 않는다. R21 대출자 하나를 끊을 때의 셈법. R22–R28 국가 재정 규칙 일곱(국가채무 수준, 재정적자, 부채 눈덩이, 경상수지, 순대외금융자산, 유동성 = A2, 스프레드)과 config/sovereign.yaml의 기본값. 점검: V23 분기 자료를 WDI와 3% 안에서 맞춘다(인도의 QNEA GDP는 어긋나 제외). V24–V26 국가 재정 검증(적중률과 오신호율, AUROC, 미리 적어 둔 기대)은 참고나 경고이며 릴리스를 막지 않는다. V11에 국가 재정 자료가 싣는 월간 파생 계열 하나(금리 스프레드)를 적었다. 기존 규칙은 바꾸지 않았고 신호판의 점수와 자금흐름도 그대로다."}
  - {version: "1.4", date: 2026-10-31, en: "After an external verification of the methodology page (16 findings, checked against the code and the raw mirror on 31 Oct 2026; docs/methodology/vulnerability-v1.4.md). R17: A2 divides by net reserves, IMF IRFCL Section I plus the predetermined net drains of Section II (both already mirrored), floored at a tenth of gross reserves; the gross figure is shown beside it. A1 adds the local foreign-currency claims of banks inside the economy on resident non-banks (BIS LBS local positions, as the BIS global liquidity definition does), for the 26 board economies that report them, and marks the ten that do not; A1 by nationality carries an offshore-issuance flag; B1's scope (every sector and currency) and the two flows' bases are stated; the flow score's sign is a creditor withdrawal, not a balance-of-payments outflow. R18: the A2 pool holds scored values only and buffers are levels only, now stated. R16: a power-of-ten unit error is rescaled, not dropped, so Uruguay's monetary base no longer ends in 2018; a listed unit correction fixes Sierra Leone's old-leone segment; V13 marks any segment that starts at a listed redenomination date. R1: dated currency regimes (Zimbabwe's dollar years), West Bank and Gaza in shekels, the IMF's currency-union aggregates named. R4, R5, R7, R9, R19: the handling of negative and confidential cells, the no-split reporters' share on the coverage panel, the IIP's period in the alignment, layers never summed, the board's scope and Bulgaria's euro date, all written down. Validation re-run with leave-one-out and bootstrap intervals.", ko: "방법론 페이지의 외부 검증(16개 지적, 2026년 10월 31일 코드와 원자료 미러로 확인. docs/methodology/vulnerability-v1.4.md) 뒤의 개정. R17: A2는 순준비자산으로 나눈다. IMF IRFCL I부에 II부의 예정된 순유출을 더한 값(둘 다 이미 미러에 있었다)이며 총준비자산의 10분의 1을 하한으로 둔다. 총준비자산 기준 값은 옆에 표시. A1에는 국내 은행의 거주 비은행에 대한 외화 채권(BIS LBS의 국내 잔액, BIS 세계 유동성 정의와 같다)을 더한다. 보고하는 신호판 26개 경제에 적용하고 보고하지 않는 10개 경제는 표시. 국적 기준 A1에 역외 발행 표시를 붙이고, B1의 범위(전체 부문·통화)와 두 흐름의 기준을 밝힌다. 자금흐름 점수의 부호는 국제수지 순유출이 아니라 채권자 이탈을 나타낸다. R18: A2 모음에는 점수에 넣는 값만 들고 완충은 수준으로만 읽는다고 적는다. R16: 10의 거듭제곱 단위 오류는 빼지 않고 되돌려, 우루과이 본원통화가 2018년에서 끝나지 않는다. 정해 둔 단위 보정이 시에라리온의 옛 레온 구간을 고치고, V13은 정해 둔 화폐 단위 변경일에 시작하는 구간을 표시한다. R1: 기간이 정해진 통화 체제(짐바브웨의 달러 사용기), 셰켈을 쓰는 요르단강 서안·가자, IMF 통화동맹 집계의 이름. R4, R5, R7, R9, R19: 음수·비공개 셀 처리, 포괄률 패널의 상품 미구분 보고국 비중, 정렬에서 IIP의 기간, 층위는 더하지 않음, 신호판의 범위와 불가리아의 유로 도입일을 모두 적었다. 검증은 하나 빼기와 부트스트랩 구간을 더해 다시 했다."}
  - {version: "1.3", date: 2026-10-31, en: "The Signal Board's vulnerability score is rebuilt after a methodology review (docs/methodology/vulnerability-v1.3.md). Method 1.2's own-history percentiles had no skill against past external-stress episodes (area under the ROC curve 0.51) and put Korea, a net creditor, first of 36. R17: A1 is by residence of the borrower (consistent with GDP); A2 is scored only where reserves are the last line of FX liquidity (not for euro members, reserve-currency issuers or a standing Fed swap line); A3 (bond share) is shown but not scored, since a higher bond share went with less stress in every test; buffers added (net IIP and the current account, IMF IIP and BOP, already in the data hub). R18: each exposure is half a level signal (its rank among every board economy-quarter so far) and half an own-history robust z with a floor on its scale; score = ½ exposure + ½ buffer weakness; point in time throughout (validated: 0.67). R19: unchanged list; reserve-currency issuers and standing swap lines named. V18 follows the new components; V20 notes A3 as context; V22 (no extreme from a tiny move in a narrow history) added. The 1.2 score ships beside the new one for one release.", ko: "방법론 검토(docs/methodology/vulnerability-v1.3.md)에 따라 신호판 취약성 점수를 다시 산출. 1.2의 자기 과거 백분위는 과거 대외 충격을 가려내지 못함(ROC 곡선 아래 면적 0.51). 순채권국인 한국을 36개 경제 중 1위로 평가. R17: A1은 차입자 거주성 기준(GDP와 같은 범위). A2는 준비자산이 외화유동성의 마지막 보루인 경제에만 점수 반영(유로 회원국, 준비통화 발행국, 연준 상설 통화스왑 경제 제외). A3(채권 비중)은 표시하되 점수 미반영. 모든 검증에서 채권 비중이 높을수록 충격이 적었음. 완충(순대외금융자산과 경상수지, 자료 저장소에 이미 있는 IMF IIP·BOP) 추가. R18: 노출 지표마다 절반은 수준 신호(그 분기까지 신호판 모든 경제·분기 가운데 순위), 절반은 척도 하한이 있는 자기 과거 로버스트 z. 점수 = ½ 노출 + ½ 완충 약점. 모두 그 시점까지의 자료만 사용(검증 0.67). R19는 목록이 같고 준비통화 발행국과 상설 통화스왑 경제를 밝힘. V18은 새 구성요소 반영, V20은 A3을 참고로 기록, V22(좁은 이력의 작은 움직임이 극단값이 되지 않음) 추가. 1.2 점수는 한 릴리스 동안 새 점수 옆에 병기."}
  - {version: "1.2", date: 2026-10-30, en: "The World page's Signal Board: R17 (vulnerability and flow indicators from the borrower's side, with BIS debt securities by nationality of issuer and CBS short-term claims), R18 (each indicator as a percentile of the economy's own history), R19 (the board's 36 economies). Checks V18 (every drawn economy complete, the rest logged), V19 (B1 is the BIS adjusted change, against a BIS reading), V20 (disjoint instruments), V21 (pulse tiles at most 10 days old) added; V11 allows the four open pulse series a year of weekly points. No earlier rule changed.", ko: "세계 화면에 신호판을 더했다. R17은 차입국 쪽에서 본 취약성·자금흐름 지표다. BIS 국제채권은 발행자 국적 기준, 단기 은행 청구권은 CBS로 측정한다. R18은 지표마다 그 경제 자신의 과거 대비 백분위를 쓴다. R19는 신호판의 36개 경제를 정한다. 점검 V18(그린 경제는 다섯 요소를 모두 갖추고 나머지는 기록), V19(B1이 BIS 조정 변동인지 BIS 값과 대조), V20(겹치지 않는 상품), V21(맥박 타일은 10일 이내)을 더했다. V11은 공개 맥박 계열 넷에 1년치 주간 점을 허용한다. 기존 규칙은 바꾸지 않았다."}
  - {version: "1.1", date: 2026-10-30, en: "After the data-integrity audit of 29 Oct 2026 (docs/DATA-AUDIT.md): R1 converts dollarised economies at one; R4 keeps one reporter per pair for the whole series; R5 splits LBS into loans and deposits, debt securities and derivatives/other, the last a pool of its own; R6 counts the IMF's reserves-and-international-organisations group as identified, uses the DIP's own total for FDI and caps coverage at 100%; R7 lets annual DIP sit at its own year in the aligned view; R16 quarantines source errors. Checks: V5 extended to reserves, Korea's ECOS IIP, CPIS assets, DIP and TIC; V7 handles negative derivatives; V13 blocks on unit errors; V14–V16 added; V8 labelled a regression test. Headlines state the drawn node. Added the same day with the World and Markets redesign, no rule changed: V17 (every source a page names is a registry link).", ko: "2026년 10월 29일 자료 정합성 감사(docs/DATA-AUDIT.md) 뒤의 개정. R1은 달러화 경제를 1로 환산. R4는 짝마다 보고 주체를 전 기간에 걸쳐 하나로 고정. R5는 LBS를 대출·예금, 채권, 파생상품·기타로 나누고 마지막을 별도 풀로 표시. R6은 IMF의 준비자산·국제기구 보유 집단을 확인분으로 집계하고, 직접투자 총계로 DIP 자체 값을 쓰며, 포괄률을 100%에서 자름. R7은 연간 DIP를 정렬 화면에서 자기 연도에 배치. R16은 원자료 오류를 격리. 점검 V5를 준비자산, 한국 ECOS IIP, CPIS 자산, DIP, TIC로 확대. V7은 음의 파생상품 처리, V13은 단위 오류 차단. V14–V16 추가. V8은 회귀 점검으로 표시. 헤드라인은 그려진 노드 기준. 같은 날 세계·시장 화면 개편과 함께, 규칙 변경 없이 V17(페이지가 밝히는 출처는 모두 등록부의 링크) 추가."}
  - {version: "1.0", date: 2026-10-29, en: "First method: rules R1–R15 and checks V1–V13.", ko: "첫 방법론: 규칙 R1–R15, 점검 V1–V13."}

