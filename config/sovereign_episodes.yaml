# Sovereign distress episodes for the Sovereign section (/[lang]/sovereign, view sovereign/global): the hand-checked list of
# IMF arrangements, euro-area/EU programmes and sovereign defaults for the 36 site economies, anything
# active on or after 1990-01-01. Hand-checked like trade-flow's config/events.yaml: every entry was read
# against the page in `source` (and `source2` when given) on 2 Nov 2026. Economies with no entry have no
# episode of these kinds since 1990. Grouped by economy (ISO3, alphabetical), oldest start first.
#
# Types
#   imf            IMF Stand-By Arrangement (SBA) or Extended Fund Facility (EFF).
#   precautionary  IMF Flexible Credit Line (FCL), Short-term Liquidity Line (SLL) (PLL/PCL/PCI: none for
#                  these economies), and SBAs/EFFs the authorities said they would treat as precautionary
#                  (IMF press release in source2) and did not draw on.
#   eu             Euro-area and EU programmes: Greek Loan Facility (GLF), EFSF, EFSM, ESM, EU balance-of-payments
#                  assistance (EU-BoP).
#   default        Sovereign debt in default, Bank of Canada-Bank of England Sovereign Default Database,
#                  2026 edition (BoC Staff Analytical Paper 2026-48, Oct 2026,
#                  https://www.bankofcanada.ca/2026/10/staff-analytical-paper-2026-48/; data read from the CSV
#                  in `source`). `facility: restructuring` marks a distressed exchange or reprofiling.
#
# Date rules
#   imf / precautionary  start = date of arrangement (Executive Board approval) and end = expiration date, both
#       from the IMF "History of Lending Commitments" table for the member (extarr2.aspx, as of 30 Sep 2026,
#       the latest date the page offers). That table shows the cancellation date for arrangements cancelled
#       early, and the last disbursement for fully drawn ones. agreed/drawn in SDR million (the table's
#       thousands / 1000); an SBA's figures include any Supplemental Reserve Facility (SRF) part (see note).
#       end_kind: replaced = a successor arrangement began the same or the next day; cancelled = early end
#       confirmed by a press release (source2); expired = the table date, no early cancellation found;
#       running = scheduled expiration after today (end null, scheduled date in note).
#   eu  start = approval of the facility (Eurogroup/Council/ESM board decision; note says which); end =
#       programme end. agreed/drawn in EUR billion.
#   default  The database is annual (US$ million in default at year end, by creditor group). A spell is a
#       run of consecutive years with at least US$100m in default to one creditor group: commercial banks
#       (FC bank loans), private bondholders (FC bonds), Paris Club, local currency (LC debt). Year spells
#       run YYYY-01-01 to YYYY-12-31 with precision: year. Where a default date is well documented, start
#       (or end) is that day with the evidence in source2/note, and precision: day. Spells running on
#       1990-01-01 keep their true start and before_sample: true. Not entered: arrears to the IMF, World
#       Bank, IDB, China and "other official creditors" (e.g. Greece 2013 and 2018, Portugal 2013, the
#       UK in every year to 2022), "other private creditors" and domestic arrears. Indonesia's Paris Club
#       entry for 1994 is left out as a suspected database error (see IDN). Argentina's bond spell, listed
#       every year 2001-2025, is split at documented events (see the ARG notes).
#
# precision refers to `start`; a coarser end is said in `note`. ko labels: 스탠드바이협약(SBA),
# 확대신용제도(EFF), 탄력적 크레딧라인(FCL), 채무불이행, 채무재조정.
# Read on 2 Nov 2026 (IMF tables as of 30 Sep 2026; BoC-BoE data to end-2025).

