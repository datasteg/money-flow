# The source registry: the one place where publisher names, dataset titles, landing pages,
# licence classes and citation forms live, in English and Korean. The site's source lines, tooltips, the Sources page,
# the citations, the licence gate (scripts/site/gate.py) and checks V11 and V12 are all built from it. A dataset that a
# drawn mark uses must have a complete entry, or the build stops.
#
# Licence classes:
#   open            derived marks shown with attribution; a CSV of the drawn marks may be offered
#   terms_pending   collected or planned, terms not yet read: never shown
#   restricted      terms read, and they do not allow public reuse: never shown
#   third_party     copyrighted series inside an open portal (BoJ on FRED, ICE BofA on FRED, KRX in ECOS): never shown
#   licensed        commercial data: never shown, and no such dataset is in this registry (R14)
#
# Terms were read on 29 Oct 2026 (the pages are listed under `terms`). `lag_days` is the publisher's usual lag after the
# period end, per cadence, used by V12 and by the page to age a mark.

classes:
  open:           {shown: true,  csv: true,  en: "Open, with attribution", ko: "공개(출처 표시)"}
  terms_pending:  {shown: false, csv: false, en: "Terms not yet read", ko: "이용 조건 확인 전"}
  restricted:     {shown: false, csv: false, en: "Terms do not allow public reuse", ko: "공개 재사용 불가"}
  third_party:    {shown: false, csv: false, en: "Third-party copyright", ko: "제3자 저작권"}
  licensed:       {shown: false, csv: false, en: "Licensed; not shown", ko: "라이선스 자료, 표시하지 않음"}

publishers:
  bis:
    en: Bank for International Settlements
    ko: 국제결제은행(BIS)
    short: BIS
    terms: https://data.bis.org/help/legal
    terms_note: "If the statistics are reproduced, the BIS must be cited as the source; no endorsement or affiliation may be implied."
  imf:
    en: International Monetary Fund
    ko: 국제통화기금(IMF)
    short: IMF
    terms: https://www.imf.org/en/about/copyright-and-terms
    terms_note: "Users may download, copy, create derivative works and publish IMF data with attribution; commercial reuse needs permission (copyright@imf.org); material changes must be stated."
  fed:
    en: Board of Governors of the Federal Reserve System
    ko: 미국 연방준비제도이사회
    short: Federal Reserve
    terms: https://fred.stlouisfed.org/legal/
    terms_note: "Federal Reserve series retrieved from FRED (Federal Reserve Bank of St. Louis). FRED asks that the source be cited and that the data be noted as accessed via FRED. Series that carry a third-party copyright are not used."
  ice:
    en: ICE Data Indices
    ko: ICE Data Indices
    short: ICE
    terms: https://fred.stlouisfed.org/series/BAMLEMCBPIOAS
    terms_note: "ICE BofA index data on FRED: reproduction in any form is prohibited without ICE's prior written permission, and FRED keeps three years of it (read 30 Oct 2026). Not used."
  ecb:
    en: European Central Bank
    ko: 유럽중앙은행(ECB)
    short: ECB
    terms: https://www.ecb.europa.eu/stats/ecb_statistics/governance_and_quality_framework/html/usage_policy.en.html
    terms_note: "Free reuse, commercial or not, provided the ECB is quoted as the source; changes must be stated explicitly."
  bok:
    en: Bank of Korea
    ko: 한국은행
    short: Bank of Korea
    terms: https://www.bok.or.kr/portal/main/contents.do?menuNo=200228
    terms_note: "The Bank of Korea must be named as the source, and any edit or processing of the data must be stated. Statistics of other agencies inside ECOS are not used."
  ust:
    en: US Department of the Treasury
    ko: 미국 재무부
    short: US Treasury
    terms: https://catalog.data.gov/dataset/treasury-international-capital-tic-archives-of-tic-monthly-data-releases
    terms_note: "Public domain (CC0 on data.gov)."
  boj:
    en: Bank of Japan
    ko: 일본은행
    short: Bank of Japan
    terms: https://www.boj.or.jp/en/about/copyright.htm
    terms_note: "Copying is allowed with explicit credit to the Bank of Japan; contents may not be altered. Its data on FRED carry the Bank of Japan's copyright, so they are not used from FRED."
  nyfed:
    en: Federal Reserve Bank of New York
    ko: 뉴욕 연방준비은행
    short: New York Fed
    terms: https://www.newyorkfed.org/privacy/termsofuse
    terms_note: "Licence to use, copy and distribute content with its copyright notice; SOFR needs the reference-rate notice."
  defillama:
    en: DefiLlama
    ko: DefiLlama
    short: DefiLlama
    terms: https://defillama.com/terms
    terms_note: "Personal, non-commercial use only; the data may not be republished in any form without permission (read 29 Oct 2026)."
  # Added 2 Nov 2026 with the fetchers moved from global-network and the Sovereign section.
  wb:
    en: World Bank
    ko: 세계은행
    short: World Bank
    terms: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    terms_note: "World Development Indicators are published under CC BY 4.0: free reuse with attribution to the World Bank and the indicator's source (read 2 Nov 2026)."
  oecd:
    en: OECD
    ko: 경제협력개발기구(OECD)
    short: OECD
    terms: https://www.oecd.org/en/about/terms-conditions.html
    terms_note: "OECD data are released under CC BY 4.0 (since July 2024). The long-term interest rates are read from FRED, which re-hosts the Main Economic Indicators and asks that the source be cited and the data noted as accessed via FRED (read 2 Nov 2026)."
  esm:
    en: European Stability Mechanism
    ko: 유럽안정메커니즘(ESM)
    short: ESM
    terms: https://www.esm.europa.eu/legal-notice
    terms_note: "Programme facts (dates, amounts) read from the ESM's and the European Commission's programme pages; reuse with attribution (read 2 Nov 2026)."
  boc:
    en: Bank of Canada and Bank of England
    ko: 캐나다은행·영란은행
    short: BoC–BoE
    terms: https://www.bankofcanada.ca/terms/
    terms_note: "The BoC–BoE Sovereign Default Database (Staff Analytical Paper 2026-48) may be reproduced with attribution to its authors and the two banks (read 2 Nov 2026)."
  ec:
    en: European Commission
    ko: 유럽연합 집행위원회
    short: European Commission
    terms: https://commission.europa.eu/legal-notice_en
    terms_note: "Reuse of Commission documents is allowed with attribution (Decision 2011/833/EU); the MIP scoreboard gives rules R25 and R26 their thresholds, no data (read 2 Nov 2026)."

